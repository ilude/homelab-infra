---
- name: Validate unified Onclave onramp required variables
  ansible.builtin.assert:
    that:
      - ansible_distribution == "Debian"
      - ansible_distribution_major_version | int >= 13
      - onramp_host_deploy_user is match('^[a-z_][a-z0-9_-]{0,31}$')
      - onramp_host_deploy_user != 'root'
      - onramp_host_deploy_dir is match('^/[A-Za-z0-9_./:-]+$')
      - onclave_server_name is match('^[A-Za-z0-9.-]+$')
      - onclave_source_git_sha is match('^[0-9a-f]{40}$')
      - onclave_app_definition_url is match('^https://raw.githubusercontent.com/[^/]+/[^/]+/[0-9a-f]{40}/')
      - onclave_source_git_sha in onclave_app_definition_url
      - onclave_app_definition_sha256 is match('^[0-9a-f]{64}$')
      - onclave_backup_script_sha256 is match('^[0-9a-f]{64}$')
      - onclave_restore_script_sha256 is match('^[0-9a-f]{64}$')
      - onclave_rabbitmq_image is match('^[^@]+@sha256:[0-9a-f]{64}$')
      - onclave_core_image_repository is match('^[A-Za-z0-9./_-]+$')
      - onclave_core_image_tag == onclave_source_git_sha
      - onclave_core_image_digest is match('^sha256:[0-9a-f]{64}$')
      - onclave_postgres_image is match('^[^@]+@sha256:[0-9a-f]{64}$')
      - onclave_ollama_image is match('^[^@]+@sha256:[0-9a-f]{64}$')
      - onclave_searxng_image is match('^[^@]+@sha256:[0-9a-f]{64}$')
      - onclave_docling_image is match('^[^@]+@sha256:[0-9a-f]{64}$')
      - onclave_rabbitmq_default_user is match('^[A-Za-z0-9_.-]+$')
      - onclave_rabbitmq_default_pass | length >= 24
      - onclave_onramp_authorized_keys | length > 0
      - "onclave_onramp_authorized_keys | select('match', '^ssh-ed25519 [A-Za-z0-9+/=]+(?: .*)?$') | list | length == onclave_onramp_authorized_keys | length"
      - onclave_onramp_postgres_database is match('^[A-Za-z_][A-Za-z0-9_-]{0,62}$')
      - onclave_onramp_postgres_user is match('^[A-Za-z_][A-Za-z0-9_-]{0,62}$')
      - onclave_onramp_postgres_password | length >= 24
      - onclave_onramp_s3_access_key | length > 0
      - onclave_onramp_s3_secret_key | length >= 24
      - onclave_onramp_s3_hostname is match('^[A-Za-z0-9.-]+$')
      - onclave_onramp_s3_endpoint is match('^[A-Za-z0-9._-]+:[0-9]{1,5}$')
      - onclave_onramp_s3_secure is boolean
      - onclave_onramp_searxng_secret | length >= 24
      - onclave_onramp_webshare_proxy_username | length > 0
      - onclave_onramp_webshare_proxy_password | length > 0
      - onclave_onramp_youtube_api_key | length > 0
      - onclave_onramp_openrouter_api_key | length > 0
      - onclave_onramp_anthropic_api_key | length > 0
      - onclave_onramp_data_root is match('^/[A-Za-z0-9_./:-]+$')
      - onclave_onramp_core_port | int > 0
      - onclave_onramp_core_port | int < 65536
      - onclave_onramp_unified_pipeline_input_budget | int >= 4000
      - onclave_onramp_amqp_port | int > 0
      - onclave_onramp_amqp_port | int < 65536
      - onclave_onramp_enable_cutover is boolean
    fail_msg: >-
      Unified Onclave requires the Debian 13 onramp host, immutable source and
      image pins, adopted state, authorized public keys, private runtime
      credentials and valid DNS names.
  no_log: true

- name: Install unified Onclave onramp OS dependencies
  ansible.builtin.apt:
    name: "{{ onclave_onramp_required_packages }}"
    state: present
    update_cache: true
  when: onclave_onramp_required_packages | length > 0

- name: Ensure unified Onclave deployment directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ onramp_host_deploy_user }}"
    group: "{{ onramp_host_deploy_user }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ onclave_onramp_base_dir }}"
      mode: "0750"
    - path: "{{ onclave_onramp_base_dir }}/bin"
      mode: "0750"
    - path: "{{ onclave_onramp_base_dir }}/env"
      mode: "0700"
    - path: "{{ onclave_onramp_base_dir }}/data"
      mode: "0750"
    - path: "{{ onclave_onramp_base_dir }}/data/rabbitmq"
      mode: "0750"
    - path: "{{ onclave_onramp_base_dir }}/data/onclave"
      mode: "0750"
    - path: "/home/{{ onramp_host_deploy_user }}/.config"
      mode: "0750"
    - path: "/home/{{ onramp_host_deploy_user }}/.config/systemd"
      mode: "0750"
    - path: "/home/{{ onramp_host_deploy_user }}/.config/systemd/user"
      mode: "0750"
    - path: "/home/{{ onramp_host_deploy_user }}/.config/containers"
      mode: "0750"
    - path: "{{ onclave_onramp_quadlet_dir }}"
      mode: "0750"

- name: Inspect adopted state directories
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ onclave_onramp_data_root }}/postgres"
    - "{{ onclave_onramp_data_root }}/ollama"
  register: onclave_onramp_adopted_state_directories

- name: Fail closed without adopted state directories
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isdir
    quiet: true
  loop: "{{ onclave_onramp_adopted_state_directories.results }}"

- name: Download pinned unified Onclave app definition
  ansible.builtin.get_url:
    url: "{{ onclave_app_definition_url }}"
    dest: "{{ onclave_onramp_base_dir }}/app-definition.upstream.yaml"
    checksum: "sha256:{{ onclave_app_definition_sha256 }}"
    owner: "{{ onramp_host_deploy_user }}"
    group: "{{ onramp_host_deploy_user }}"
    mode: "0640"

- name: Install pinned unified Onclave PostgreSQL backup helpers
  ansible.builtin.get_url:
    url: "{{ onclave_app_definition_url | regex_replace('compose\\.yaml$', item.name) }}"
    dest: "{{ onclave_onramp_base_dir }}/bin/{{ item.name }}"
    checksum: "sha256:{{ item.sha256 }}"
    owner: "{{ onramp_host_deploy_user }}"
    group: "{{ onramp_host_deploy_user }}"
    mode: "0750"
  loop:
    - name: backup-postgres.sh
      sha256: "{{ onclave_backup_script_sha256 }}"
    - name: restore-postgres.sh
      sha256: "{{ onclave_restore_script_sha256 }}"

- name: Read pinned unified Onclave app definition
  ansible.builtin.slurp:
    src: "{{ onclave_onramp_base_dir }}/app-definition.upstream.yaml"
  register: onclave_onramp_upstream_definition

- name: Parse pinned unified Onclave app definition
  ansible.builtin.set_fact:
    onclave_onramp_definition: "{{ onclave_onramp_upstream_definition.content | b64decode | from_yaml }}"

- name: Validate unified Onclave app definition consumer seams
  vars:
    onclave_onramp_upstream_text: "{{ onclave_onramp_upstream_definition.content | b64decode }}"
  ansible.builtin.assert:
    that:
      - onclave_onramp_definition.name == 'onclave'
      - "'rabbitmq' in onclave_onramp_definition.services"
      - "'postgres' in onclave_onramp_definition.services"
      - "'ollama' in onclave_onramp_definition.services"
      - "'searxng' in onclave_onramp_definition.services"
      - "'docling-serve' in onclave_onramp_definition.services"
      - "'onclave-core' in onclave_onramp_definition.services"
      - onclave_onramp_definition.services.rabbitmq.ports | default([]) | length == 0
      - "'- \"8000:8000\"' in onclave_onramp_upstream_text"
      - "'- postgres-data:/var/lib/postgresql/data' in onclave_onramp_upstream_text"
      - "'- ollama-data:/root/.ollama' in onclave_onramp_upstream_text"
      - "'POSTGRES_PASSWORD' in onclave_onramp_upstream_text"
      - "'SEARXNG_SECRET' in onclave_onramp_upstream_text"
      - "'ONCLAVE_VAULT_SSH_PUBLIC_KEYS_PATH' in onclave_onramp_upstream_text"
    fail_msg: >-
      The pinned unified Onclave app definition changed its required services,
      consumer-owned networking or storage seams, or vault environment contract.

- name: Validate native Onclave Quadlet source contract
  ansible.builtin.assert:
    that:
      - onclave_onramp_definition.services.rabbitmq.environment.RABBITMQ_DEFAULT_VHOST == 'onclave'
      - onclave_onramp_definition.services.rabbitmq.healthcheck.test == ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      - onclave_onramp_definition.services.rabbitmq.healthcheck.interval == '10s'
      - onclave_onramp_definition.services.rabbitmq.healthcheck.timeout == '10s'
      - onclave_onramp_definition.services.rabbitmq.healthcheck.retries == 30
      - onclave_onramp_definition.services.rabbitmq.healthcheck.start_period == '60s'
      - onclave_onramp_definition.services.postgres.healthcheck.test[0] == 'CMD-SHELL'
      - onclave_onramp_definition.services.postgres.healthcheck.interval == '10s'
      - onclave_onramp_definition.services.postgres.healthcheck.timeout == '5s'
      - onclave_onramp_definition.services.postgres.healthcheck.retries == 10
      - onclave_onramp_definition.services.postgres.healthcheck.start_period == '20s'
      - onclave_onramp_definition.services.postgres.configs | length == 1
      - onclave_onramp_definition.services.ollama.volumes == ['ollama-data:/root/.ollama']
      - onclave_onramp_definition.services.searxng.environment.GRANIAN_HOST == '0.0.0.0'
      - onclave_onramp_definition.services['docling-serve'].environment.DOCLING_SERVE_ENABLE_UI == '0'
      - onclave_onramp_definition.services['onclave-core'].ports == ['8000:8000']
      - onclave_onramp_definition.services['onclave-core'].depends_on.keys() | sort == ['docling-serve', 'minio', 'ollama', 'postgres', 'rabbitmq', 'searxng']
      - onclave_onramp_definition.services['onclave-core'].volumes == ['onclave-data:/data']
      - onclave_onramp_definition.services['onclave-core'].configs | length == 1
      - onclave_onramp_definition.services['onclave-core'].healthcheck.interval == '10s'
      - onclave_onramp_definition.services['onclave-core'].healthcheck.timeout == '5s'
      - onclave_onramp_definition.services['onclave-core'].healthcheck.retries == 5
      - onclave_onramp_definition.services['onclave-core'].healthcheck.start_period == '20s'
      - onclave_onramp_definition.services['onclave-core'].environment.ONCLAVE_VAULT_POSTGRES_HOST == 'postgres'
      - onclave_onramp_definition.services['onclave-core'].environment.ONCLAVE_VAULT_OLLAMA_URL == 'http://ollama:11434'
      - onclave_onramp_definition.services['onclave-core'].environment.ONCLAVE_VAULT_DOCLING_URL == 'http://docling-serve:5001'
    fail_msg: >-
      The pinned Onclave app definition changed a service, health, dependency,
      networking, storage, or runtime seam mapped by the native Quadlet units.

- name: Install native Onclave service environment contracts
  ansible.builtin.template:
    src: "{{ item }}.env.j2"
    dest: "{{ onclave_onramp_base_dir }}/env/{{ item }}.env"
    owner: "{{ onramp_host_deploy_user }}"
    group: "{{ onramp_host_deploy_user }}"
    mode: "0600"
  loop:
    - rabbitmq
    - postgres
    - ollama
    - searxng
    - docling
    - core
  no_log: true
  notify: Restart onclave onramp

- name: Install unified Onclave authorized public keys
  ansible.builtin.template:
    src: authorized_keys.j2
    dest: "{{ onclave_onramp_base_dir }}/authorized_keys"
    owner: "{{ onramp_host_deploy_user }}"
    group: "{{ onramp_host_deploy_user }}"
    mode: "0640"
  no_log: true
  notify: Restart onclave onramp

- name: Resolve unified Onclave deploy user UID
  ansible.builtin.command:
    argv:
      - id
      - -u
      - "{{ onramp_host_deploy_user }}"
  register: onclave_onramp_deploy_user_uid
  changed_when: false

- name: Discover existing Onclave SearXNG volume identities
  become: true
  become_user: "{{ onramp_host_deploy_user }}"
  ansible.builtin.shell: |
    set -euo pipefail
    ids="$({
      podman ps --all --quiet --filter name=^onclave-searxng$
      podman ps --all --quiet \
        --filter label=com.docker.compose.project=onclave \
        --filter label=com.docker.compose.service=searxng
      podman ps --all --quiet \
        --filter label=io.podman.compose.project=onclave \
        --filter label=com.docker.compose.service=searxng
      podman ps --all --quiet --filter 'name=^onclave[-_]searxng[-_][0-9]+$'
    } | sort -u)"
    test "$(wc -w <<< "$ids")" -eq 1
    podman inspect $ids | python3 -c '
    import json, sys
    mounts = json.load(sys.stdin)[0].get("Mounts", [])
    expected = ("/etc/searxng", "/var/cache/searxng")
    found = {}
    required_options = {"nodev", "exec", "nosuid", "rbind"}
    for mount in mounts:
        destination = mount.get("Destination")
        options = set(mount.get("Options", []))
        if (
            destination in expected
            and mount.get("Type") == "volume"
            and mount.get("RW") is True
            and required_options <= options
            and mount.get("Propagation") == "rprivate"
        ):
            found[destination] = mount.get("Name")
    if set(found) != set(expected) or not all(found.values()):
        raise SystemExit("required SearXNG volume mounts or options were not found")
    print(json.dumps(found, sort_keys=True))'
  args:
    executable: /bin/bash
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ onclave_onramp_deploy_user_uid.stdout | trim }}"
  register: onclave_onramp_searxng_mounts_raw
  changed_when: false
  no_log: true
  when: onclave_onramp_enable_cutover | bool

- name: Preserve existing Onclave SearXNG volume identities
  ansible.builtin.set_fact:
    onclave_onramp_searxng_config_volume: >-
      {{ (onclave_onramp_searxng_mounts_raw.stdout | from_json)['/etc/searxng'] }}
    onclave_onramp_searxng_cache_volume: >-
      {{ (onclave_onramp_searxng_mounts_raw.stdout | from_json)['/var/cache/searxng'] }}
  no_log: true
  when: onclave_onramp_enable_cutover | bool

- name: Validate preserved Onclave SearXNG volume identities
  ansible.builtin.assert:
    that:
      - onclave_onramp_searxng_config_volume is match('^[A-Za-z0-9][A-Za-z0-9_.-]+$')
      - onclave_onramp_searxng_cache_volume is match('^[A-Za-z0-9][A-Za-z0-9_.-]+$')
      - onclave_onramp_searxng_config_volume != onclave_onramp_searxng_cache_volume
    quiet: true
  no_log: true
  when: onclave_onramp_enable_cutover | bool

- name: Detect legacy Onclave target unit
  ansible.builtin.stat:
    path: "/home/{{ onramp_host_deploy_user }}/.config/systemd/user/onclave-onramp.target"
  register: onclave_onramp_legacy_target

- name: Detect superseded Onclave compose service unit
  ansible.builtin.stat:
    path: "/home/{{ onramp_host_deploy_user }}/.config/systemd/user/onclave-onramp.service"
  register: onclave_onramp_legacy_compose_service

- name: Stop and disable legacy Onclave target
  become: true
  become_user: "{{ onramp_host_deploy_user }}"
  ansible.builtin.systemd_service:
    name: onclave-onramp.target
    scope: user
    state: stopped
    enabled: false
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ onclave_onramp_deploy_user_uid.stdout | trim }}"
  register: onclave_onramp_legacy_target_stop
  when:
    - onclave_onramp_enable_cutover | bool
    - onclave_onramp_legacy_target.stat.exists

- name: Stop and disable superseded Onclave compose service
  become: true
  become_user: "{{ onramp_host_deploy_user }}"
  ansible.builtin.systemd_service:
    name: onclave-onramp.service
    scope: user
    state: stopped
    enabled: false
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ onclave_onramp_deploy_user_uid.stdout | trim }}"
  when:
    - onclave_onramp_enable_cutover | bool
    - onclave_onramp_legacy_compose_service.stat.exists

- name: Verify legacy Onclave target is stopped before cutover
  become: true
  become_user: "{{ onramp_host_deploy_user }}"
  ansible.builtin.command:
    argv:
      - systemctl
      - --user
      - is-active
      - onclave-onramp.target
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ onclave_onramp_deploy_user_uid.stdout | trim }}"
  register: onclave_onramp_legacy_target_active
  changed_when: false
  failed_when: onclave_onramp_legacy_target_active.rc == 0
  when: onclave_onramp_enable_cutover | bool

- name: Verify superseded Onclave compose service is stopped before cutover
  become: true
  become_user: "{{ onramp_host_deploy_user }}"
  ansible.builtin.command:
    argv:
      - systemctl
      - --user
      - is-active
      - onclave-onramp.service
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ onclave_onramp_deploy_user_uid.stdout | trim }}"
  register: onclave_onramp_legacy_compose_active
  changed_when: false
  failed_when: onclave_onramp_legacy_compose_active.rc == 0
  when: onclave_onramp_enable_cutover | bool

- name: Stop legacy Onclave containers before final corpus backup
  become: true
  become_user: "{{ onramp_host_deploy_user }}"
  ansible.builtin.shell: |
    set -euo pipefail
    compose_ids() {
      local service="$1"
      {
        podman ps --quiet \
          --filter label=com.docker.compose.project=onclave \
          --filter "label=com.docker.compose.service=${service}"
        podman ps --quiet \
          --filter label=io.podman.compose.project=onclave \
          --filter "label=com.docker.compose.service=${service}"
        podman ps --quiet \
          --filter label=io.podman.compose.project=onclave \
          --filter "label=io.podman.compose.service=${service}"
        podman ps --quiet --filter "name=^onclave[-_]${service}[-_][0-9]+$"
      } | sort -u
    }
    for service in rabbitmq postgres ollama searxng docling-serve onclave-core minio; do
      ids="$(compose_ids "$service")"
      if [[ -n "$ids" ]]; then
        podman stop --time 30 $ids
      fi
    done
  args:
    executable: /bin/bash
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ onclave_onramp_deploy_user_uid.stdout | trim }}"
  register: onclave_onramp_legacy_stop
  changed_when: onclave_onramp_legacy_stop.stdout | trim | length > 0
  no_log: true
  when: onclave_onramp_enable_cutover | bool

- name: Verify no legacy Onclave containers are running before backup
  become: true
  become_user: "{{ onramp_host_deploy_user }}"
  ansible.builtin.shell: |
    set -euo pipefail
    {
      podman ps --quiet \
        --filter label=com.docker.compose.project=onclave \
        --filter "label=com.docker.compose.service={{ item }}"
      podman ps --quiet \
        --filter label=io.podman.compose.project=onclave \
        --filter "label=com.docker.compose.service={{ item }}"
      podman ps --quiet \
        --filter label=io.podman.compose.project=onclave \
        --filter "label=io.podman.compose.service={{ item }}"
      podman ps --quiet --filter "name=^onclave[-_]{{ item }}[-_][0-9]+$"
    } | sort -u
  args:
    executable: /bin/bash
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ onclave_onramp_deploy_user_uid.stdout | trim }}"
  register: onclave_onramp_legacy_running
  changed_when: false
  failed_when: onclave_onramp_legacy_running.stdout_lines | length > 0
  loop:
    - rabbitmq
    - postgres
    - ollama
    - searxng
    - docling-serve
    - onclave-core
    - minio
  when: onclave_onramp_enable_cutover | bool

- name: Validate explicit Onclave cutover backup inputs
  ansible.builtin.assert:
    that:
      - lookup('env', 'ONCLAVE_VAULT_S3_WORKSTATION_ENDPOINT') is match('^https://[A-Za-z0-9.-]+$')
      - lookup('env', 'ONCLAVE_VAULT_S3_BUCKET') == 'menos'
      - lookup('env', 'ONCLAVE_VAULT_S3_REGION') is match('^[a-z0-9-]+$')
      - lookup('env', 'SEAWEEDFS_OBJECT_BACKUP_ARCHIVE') is match('^/workspace/values/service-backups/onclave_onramp/[^/]+\\.tar\\.gz$')
    fail_msg: >-
      An explicit Onclave cutover requires the BWS workstation HTTPS endpoint,
      the menos bucket, and a new private final corpus archive path.
  no_log: true
  when: onclave_onramp_enable_cutover | bool

- name: Create final Onclave corpus backup while writes are quiesced
  when: onclave_onramp_enable_cutover | bool
  block:
    - name: Create orchestration-owned Onclave quiescence marker
      ansible.builtin.tempfile:
        state: file
        prefix: onclave-quiesced-
      delegate_to: localhost
      become: false
      register: onclave_onramp_quiescence_marker
      changed_when: true

    - name: Write exact fresh final Onclave corpus artifact
      ansible.builtin.command:
        argv:
          - python
          - scripts/seaweedfs-object-backup.py
          - backup
          - --endpoint
          - "{{ lookup('env', 'ONCLAVE_VAULT_S3_WORKSTATION_ENDPOINT') }}"
          - --bucket
          - "{{ lookup('env', 'ONCLAVE_VAULT_S3_BUCKET') }}"
          - --region
          - "{{ lookup('env', 'ONCLAVE_VAULT_S3_REGION') }}"
          - --output
          - "{{ lookup('env', 'SEAWEEDFS_OBJECT_BACKUP_ARCHIVE') }}"
          - --quiesced-marker
          - "{{ onclave_onramp_quiescence_marker.path }}"
      args:
        chdir: /workspace
      delegate_to: localhost
      become: false
      environment:
        AWS_ACCESS_KEY_ID: "{{ lookup('env', 'ONCLAVE_VAULT_S3_ACCESS_KEY') }}"
        AWS_SECRET_ACCESS_KEY: "{{ lookup('env', 'ONCLAVE_VAULT_S3_SECRET_KEY') }}"
      changed_when: true
      no_log: true
  always:
    - name: Remove orchestration-owned Onclave quiescence marker
      ansible.builtin.file:
        path: "{{ onclave_onramp_quiescence_marker.path }}"
        state: absent
      delegate_to: localhost
      become: false
      when: onclave_onramp_quiescence_marker.path is defined

- name: Remove legacy Onclave containers
  become: true
  become_user: "{{ onramp_host_deploy_user }}"
  ansible.builtin.shell: |
    set -euo pipefail
    compose_ids() {
      local service="$1"
      {
        podman ps --all --quiet \
          --filter label=com.docker.compose.project=onclave \
          --filter "label=com.docker.compose.service=${service}"
        podman ps --all --quiet \
          --filter label=io.podman.compose.project=onclave \
          --filter "label=com.docker.compose.service=${service}"
        podman ps --all --quiet \
          --filter label=io.podman.compose.project=onclave \
          --filter "label=io.podman.compose.service=${service}"
        podman ps --all --quiet --filter "name=^onclave[-_]${service}[-_][0-9]+$"
      } | sort -u
    }
    for service in rabbitmq postgres ollama searxng docling-serve onclave-core; do
      ids="$(compose_ids "$service")"
      if [[ -n "$ids" ]]; then
        timeout --signal=TERM 60 podman rm --force $ids
      fi
    done
  args:
    executable: /bin/bash
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ onclave_onramp_deploy_user_uid.stdout | trim }}"
  register: onclave_onramp_legacy_rm
  changed_when: onclave_onramp_legacy_rm.stdout | trim | length > 0
  no_log: true
  when: onclave_onramp_enable_cutover | bool

- name: Verify preserved Onclave SearXNG volumes survived container removal
  become: true
  become_user: "{{ onramp_host_deploy_user }}"
  ansible.builtin.command:
    argv:
      - podman
      - volume
      - exists
      - "{{ item }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ onclave_onramp_deploy_user_uid.stdout | trim }}"
  loop:
    - "{{ onclave_onramp_searxng_config_volume }}"
    - "{{ onclave_onramp_searxng_cache_volume }}"
  changed_when: false
  no_log: true
  when: onclave_onramp_enable_cutover | bool

- name: Remove superseded Onclave compose service files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/home/{{ onramp_host_deploy_user }}/.config/systemd/user/onclave-onramp.target"
    - "/home/{{ onramp_host_deploy_user }}/.config/systemd/user/onclave-onramp.service"
    - "{{ onclave_onramp_base_dir }}/compose.yaml"
    - "{{ onclave_onramp_base_dir }}/compose.upstream.yaml"
    - "{{ onclave_onramp_base_dir }}/.core-rollout.override.yaml"
    - "{{ onclave_onramp_base_dir }}/.env"
  when: onclave_onramp_enable_cutover | bool

- name: Reload user systemd manager after legacy unit removal
  become: true
  become_user: "{{ onramp_host_deploy_user }}"
  ansible.builtin.systemd_service:
    scope: user
    daemon_reload: true
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ onclave_onramp_deploy_user_uid.stdout | trim }}"
  when: onclave_onramp_enable_cutover | bool

- name: Find retired MinIO containers from the previous Onclave stack
  become: true
  become_user: "{{ onramp_host_deploy_user }}"
  ansible.builtin.command:
    argv:
      - podman
      - ps
      - --all
      - --quiet
      - --filter
      - label=com.docker.compose.service=minio
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ onclave_onramp_deploy_user_uid.stdout | trim }}"
  register: onclave_onramp_retired_minio_containers
  changed_when: false
  when: onclave_onramp_enable_cutover | bool

- name: Remove retired MinIO containers without touching their data directory
  become: true
  become_user: "{{ onramp_host_deploy_user }}"
  ansible.builtin.command:
    argv:
      - timeout
      - --signal=TERM
      - "60"
      - podman
      - rm
      - --force
      - "{{ item }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ onclave_onramp_deploy_user_uid.stdout | trim }}"
  loop: "{{ onclave_onramp_retired_minio_containers.stdout_lines }}"
  changed_when: true
  when: onclave_onramp_enable_cutover | bool

- name: Install native Onclave rootless Quadlet units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ onclave_onramp_quadlet_dir }}/{{ item }}"
    owner: "{{ onramp_host_deploy_user }}"
    group: "{{ onramp_host_deploy_user }}"
    mode: "0644"
  loop:
    - onclave.network
    - onclave-rabbitmq.container
    - onclave-postgres.container
    - onclave-ollama.container
    - onclave-searxng.container
    - onclave-docling.container
    - onclave-core.container
  notify: Restart onclave onramp
  when: onclave_onramp_enable_cutover | bool

- name: Install native Onclave rootless target
  ansible.builtin.template:
    src: onclave-onramp.target.j2
    dest: "/home/{{ onramp_host_deploy_user }}/.config/systemd/user/onclave-onramp.target"
    owner: "{{ onramp_host_deploy_user }}"
    group: "{{ onramp_host_deploy_user }}"
    mode: "0644"
  notify: Restart onclave onramp
  when: onclave_onramp_enable_cutover | bool

- name: Start native RabbitMQ before credential reconciliation
  become: true
  become_user: "{{ onramp_host_deploy_user }}"
  ansible.builtin.systemd_service:
    name: onclave-rabbitmq.service
    scope: user
    daemon_reload: true
    state: started
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ onclave_onramp_deploy_user_uid.stdout | trim }}"
  when: onclave_onramp_enable_cutover | bool

- name: Verify persisted RabbitMQ password matches BWS
  become: true
  become_user: "{{ onramp_host_deploy_user }}"
  ansible.builtin.command:
    argv:
      - podman
      - exec
      - onclave-rabbitmq
      - rabbitmqctl
      - authenticate_user
      - "{{ onclave_rabbitmq_default_user }}"
      - "{{ onclave_rabbitmq_default_pass }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ onclave_onramp_deploy_user_uid.stdout | trim }}"
  register: onclave_onramp_rabbitmq_auth
  changed_when: false
  failed_when: false
  no_log: true
  when: onclave_onramp_enable_cutover | bool

- name: Reconcile persisted RabbitMQ password from BWS
  become: true
  become_user: "{{ onramp_host_deploy_user }}"
  ansible.builtin.command:
    argv:
      - podman
      - exec
      - onclave-rabbitmq
      - rabbitmqctl
      - change_password
      - "{{ onclave_rabbitmq_default_user }}"
      - "{{ onclave_rabbitmq_default_pass }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ onclave_onramp_deploy_user_uid.stdout | trim }}"
  register: onclave_onramp_rabbitmq_reconcile
  retries: 24
  delay: 5
  until: onclave_onramp_rabbitmq_reconcile.rc == 0
  when:
    - onclave_onramp_enable_cutover | bool
    - onclave_onramp_rabbitmq_auth.rc != 0
  no_log: true

- name: Enable native Onclave rootless target
  become: true
  become_user: "{{ onramp_host_deploy_user }}"
  ansible.builtin.systemd_service:
    name: onclave-onramp.target
    scope: user
    daemon_reload: true
    enabled: true
    state: restarted
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ onclave_onramp_deploy_user_uid.stdout | trim }}"
  when: onclave_onramp_enable_cutover | bool

- name: Remove retired inbound Onclave AMQP firewall rules
  ansible.builtin.command:
    argv:
      - ufw
      - --force
      - delete
      - allow
      - from
      - "{{ item }}"
      - to
      - any
      - port
      - "{{ onclave_onramp_amqp_port | string }}"
      - proto
      - tcp
  loop: "{{ onramp_host_allowed_ssh_cidrs }}"
  register: onclave_onramp_retired_amqp_firewall
  changed_when: "'Rule deleted' in onclave_onramp_retired_amqp_firewall.stdout"
  failed_when: >-
    onclave_onramp_retired_amqp_firewall.rc != 0 and
    'Could not delete non-existent rule' not in
    (onclave_onramp_retired_amqp_firewall.stdout ~ onclave_onramp_retired_amqp_firewall.stderr)
  no_log: true
  when: onclave_onramp_enable_cutover | bool

- name: Ensure onramp Caddy supports Cloudflare DNS-01
  ansible.builtin.include_role:
    name: caddy_build
  when: onclave_onramp_enable_cutover | bool

- name: Install Onclave Caddy site snippets
  ansible.builtin.template:
    src: onclave.caddy.j2
    dest: /etc/caddy/sites.d/onclave.caddy
    owner: root
    group: root
    mode: "0644"
  notify: Reload caddy
  when: onclave_onramp_enable_cutover | bool

- name: Validate Onclave Caddy config
  ansible.builtin.command:
    argv:
      - bash
      - -lc
      - set -a && . /etc/caddy/env && set +a && caddy validate --config /etc/caddy/Caddyfile
  changed_when: false
  when: onclave_onramp_enable_cutover | bool

- name: Flush unified Onclave service restarts before health checks
  ansible.builtin.meta: flush_handlers
  when: onclave_onramp_enable_cutover | bool

- name: Verify native Onclave rootless target is active
  become: true
  become_user: "{{ onramp_host_deploy_user }}"
  ansible.builtin.command:
    argv:
      - systemctl
      - --user
      - is-active
      - onclave-onramp.target
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ onclave_onramp_deploy_user_uid.stdout | trim }}"
  changed_when: false
  register: onclave_onramp_service_active
  retries: 12
  delay: 10
  until: onclave_onramp_service_active.rc == 0
  when: onclave_onramp_enable_cutover | bool

- name: Resolve running native Onclave core container ID
  become: true
  become_user: "{{ onramp_host_deploy_user }}"
  ansible.builtin.command:
    argv:
      - podman
      - ps
      - --quiet
      - --filter
      - name=^onclave-core$
      - --filter
      - label=io.homelab.onclave.service=onclave-core
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ onclave_onramp_deploy_user_uid.stdout | trim }}"
  register: onclave_onramp_core_container_ids
  changed_when: false
  no_log: true
  when: onclave_onramp_enable_cutover | bool

- name: Fail closed without exactly one running unified Onclave core container
  ansible.builtin.assert:
    that:
      - onclave_onramp_core_container_ids.stdout_lines | length == 1
    quiet: true
  no_log: true
  when: onclave_onramp_enable_cutover | bool

- name: Verify configured Onclave embedding provider
  become: true
  become_user: "{{ onramp_host_deploy_user }}"
  ansible.builtin.command:
    argv:
      - podman
      - exec
      - "{{ onclave_onramp_core_container_ids.stdout_lines[0] }}"
      - node
      - --input-type=module
      - -e
      - >-
        const provider = process.env.ONCLAVE_VAULT_EMBEDDING_PROVIDER || 'ollama';
        const model = process.env.ONCLAVE_VAULT_EMBEDDING_MODEL || process.env.ONCLAVE_VAULT_OLLAMA_MODEL;
        let downloaded = false;
        if (provider === 'openrouter') {
        const response = await fetch('https://openrouter.ai/api/v1/embeddings',
        {method: 'POST', headers: {authorization: 'Bearer ' + process.env.ONCLAVE_VAULT_OPENROUTER_API_KEY,
        'content-type': 'application/json'}, body: JSON.stringify({model, input: ['deployment readiness']})});
        const body = response.ok ? await response.json() : {};
        if (!response.ok || !Array.isArray(body.data) || body.data[0]?.embedding?.length !== 1024)
        throw new Error('OpenRouter embedding verification failed');
        } else if (provider === 'ollama') {
        const base = process.env.ONCLAVE_VAULT_OLLAMA_URL.replace(/\/$/, '');
        const tags = await fetch(base + '/api/tags').then(response => response.json());
        const names = new Set((tags.models || []).map(item => item.name));
        const present = names.has(model) || names.has(model + ':latest');
        if (!present) { const response = await fetch(base + '/api/pull',
        {method: 'POST', headers: {'content-type': 'application/json'},
        body: JSON.stringify({name: model, stream: false})}); if (!response.ok) throw new Error('Ollama model pull failed'); }
        downloaded = !present;
        const warmup = await fetch(base + '/api/embed', {method: 'POST',
        headers: {'content-type': 'application/json'}, body: JSON.stringify({model, input: 'deployment readiness', truncate: true})});
        const body = warmup.ok ? await warmup.json() : {};
        if (!warmup.ok || body.embeddings?.[0]?.length !== 1024) throw new Error('Ollama embedding verification failed');
        } else { throw new Error('Unsupported embedding provider: ' + provider); }
        console.log(JSON.stringify({provider, downloaded, verified: true}));
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ onclave_onramp_deploy_user_uid.stdout | trim }}"
  register: onclave_onramp_embedding_model
  changed_when: "'\"downloaded\":true' in onclave_onramp_embedding_model.stdout"
  no_log: true
  when: onclave_onramp_enable_cutover | bool

- name: Verify SeaweedFS application bucket through the Onclave S3 contract
  become: true
  become_user: "{{ onramp_host_deploy_user }}"
  ansible.builtin.command:
    argv:
      - podman
      - exec
      - "{{ onclave_onramp_core_container_ids.stdout_lines[0] }}"
      - node
      - --input-type=module
      - -e
      - >-
        import { Client } from 'minio';
        const endpoint = process.env.ONCLAVE_VAULT_S3_ENDPOINT_URL;
        const [endPoint, port] = endpoint.split(':');
        const client = new Client({endPoint, port: Number(port),
        useSSL: process.env.ONCLAVE_VAULT_S3_SECURE === 'true',
        accessKey: process.env.ONCLAVE_VAULT_S3_ACCESS_KEY,
        secretKey: process.env.ONCLAVE_VAULT_S3_SECRET_KEY});
        const bucket = process.env.ONCLAVE_VAULT_S3_BUCKET;
        if (!(await client.bucketExists(bucket))) throw new Error('S3 bucket is missing');
        const key = 'checks/onclave-cutover-' + Date.now();
        await client.putObject(bucket, key, Buffer.from('cutover-check'),
        {'content-type': 'application/octet-stream'});
        const chunks = [];
        for await (const chunk of await client.getObject(bucket, key)) chunks.push(chunk);
        if (Buffer.concat(chunks).toString() !== 'cutover-check') throw new Error('S3 readback failed');
        await client.removeObject(bucket, key);
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ onclave_onramp_deploy_user_uid.stdout | trim }}"
  changed_when: false
  no_log: true
  when: onclave_onramp_enable_cutover | bool

- name: Verify unified Onclave health and source revision
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ onclave_onramp_core_port }}/health"
    status_code: 200
    return_content: true
  register: onclave_onramp_health
  retries: 60
  delay: 10
  until:
    - onclave_onramp_health.status == 200
    - onclave_onramp_health.json.status | default('') == 'ok'
    - onclave_onramp_health.json.git_sha | default('') == onclave_source_git_sha
    - onclave_onramp_health.json.broker.connected | default(false) | bool
  when: onclave_onramp_enable_cutover | bool

- name: Verify unified Onclave dependency readiness
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ onclave_onramp_core_port }}/ready"
    status_code: 200
    return_content: true
  register: onclave_onramp_ready
  retries: 60
  delay: 10
  until:
    - onclave_onramp_ready.status == 200
    - onclave_onramp_ready.json.status | default('') == 'ready'
    - onclave_onramp_ready.json.checks.postgres | default('') == 'ok'
    - onclave_onramp_ready.json.checks.s3 | default('') == 'ok'
    - onclave_onramp_ready.json.checks.ollama | default('') == 'ok'
  when: onclave_onramp_enable_cutover | bool

- name: Verify unified Onclave HTTPS route locally
  ansible.builtin.command:
    argv:
      - curl
      - --fail
      - --silent
      - --show-error
      - --insecure
      - --max-time
      - "10"
      - --resolve
      - "{{ onclave_server_name }}:443:127.0.0.1"
      - "https://{{ onclave_server_name }}/health"
  changed_when: false
  register: onclave_onramp_https_check
  retries: 24
  delay: 5
  until: onclave_onramp_https_check.rc == 0
  when: onclave_onramp_enable_cutover | bool

- name: Validate signed Onclave API
  when: onclave_onramp_enable_cutover | bool
  block:
    - name: Run signed Onclave API validation
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ playbook_dir }}/../../../scripts/check-onclave-api.py"
          - "https://{{ onclave_server_name }}"
          - "~/.ssh/id_ed25519"
      delegate_to: localhost
      become: false
      changed_when: false
      no_log: true
  rescue:
    - name: Report signed Onclave API validation failure
      ansible.builtin.fail:
        msg: signed Onclave API validation failed
