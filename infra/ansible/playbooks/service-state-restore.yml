---
- name: Restore managed service state from controller values directory or device-local latest archive
  hosts: "{{ service_state_hosts | default('all') }}"
  gather_facts: false
  become: true
  vars_files:
    - ../vars/service-state.yml
  vars:
    service_state_backup_root: "{{ lookup('env', 'SERVICE_STATE_BACKUP_ROOT') | default('/workspace/values/service-backups', true) }}"
    service_state_restore_file: "{{ lookup('env', 'SERVICE_STATE_RESTORE_FILE') | default('', true) }}"
  tasks:
    - name: Validate service-state restore input
      ansible.builtin.assert:
        that:
          - service_state_service is defined
          - service_state_service in managed_service_state_catalog
          - service_state_hosts is defined
          - service_state_restore_file | length > 0
          - >-
            service_state_restore_file is match('^/workspace/values/service-backups/' ~ service_state_service ~ '/.+\.tar\.gz$') or
            (service_state_service == 'onclave_onramp' and
             (service_state_restore_file == 'latest' or
              service_state_restore_file is match('^onclave_onramp-state-[0-9]{8}T[0-9]{6,}Z\.tar\.gz$') or
              service_state_restore_file is match('^onclave_onramp-state-pre-restore-[0-9]{8}T[0-9]{6,}Z\.tar(\.gz)?$')))
        fail_msg: >-
          A controller archive under /workspace/values/service-backups/<service>/
          or a constrained Onclave device archive selector is required.

    - name: Select managed service-state definition
      ansible.builtin.set_fact:
        service_state_definition: "{{ managed_service_state_catalog[service_state_service] }}"
        service_state_timestamp: "{{ lookup('pipe', 'date -u +%Y%m%dT%H%M%S%NZ') }}"

    - name: Select service-state restore storage model
      ansible.builtin.set_fact:
        service_state_uses_device_backup: "{{ service_state_definition.device_backup_root is defined }}"
        service_state_restore_uses_device_archive: >-
          {{ service_state_service == 'onclave_onramp' and
             (service_state_restore_file == 'latest' or
              service_state_restore_file is match('^onclave_onramp-state-[0-9]{8}T[0-9]{6,}Z\.tar\.gz$') or
              service_state_restore_file is match('^onclave_onramp-state-pre-restore-[0-9]{8}T[0-9]{6,}Z\.tar(\.gz)?$')) }}

    - name: Validate service-state restore archive coverage configuration
      ansible.builtin.assert:
        that:
          - service_state_definition.restore_require_all_paths | default(false) is boolean
          - >-
            service_state_definition.backup_staging_root is not defined or
            (service_state_definition.backup_staging_root is string and
            service_state_definition.backup_staging_root is match('^/'))
        fail_msg: >-
          restore_require_all_paths must be a Boolean and backup_staging_root
          must be absolute when configured.

    - name: Validate device-local restore configuration
      ansible.builtin.assert:
        that:
          - service_state_definition.device_backup_root is string
          - service_state_definition.device_backup_root is match('^/')
          - service_state_definition.backup_retention_count is integer
          - service_state_definition.backup_retention_count | int > 0
        fail_msg: >-
          Device-local restores require an absolute backup root and a positive
          integer retention count.
      when: service_state_uses_device_backup | bool

    - name: Build managed service-state path and account lists
      ansible.builtin.set_fact:
        service_state_managed_paths: "{{ service_state_definition.paths | map(attribute='path') | list }}"
        service_state_managed_users: "{{ service_state_definition.paths | map(attribute='owner') | unique | list }}"
        service_state_managed_groups: "{{ service_state_definition.paths | map(attribute='group') | unique | list }}"

    - name: Validate selected target, host cardinality, and service scopes
      ansible.builtin.assert:
        that:
          - service_state_hosts == service_state_definition.group
          - service_state_definition.group in groups
          - groups[service_state_definition.group] | length > 0
          - ansible_play_hosts_all | length == 1
          - service_state_definition.paths | length > 0
          - (service_state_definition.services | default([]) | length) == (service_state_definition.services | default([]) | unique | length)
          - (service_state_definition.user_services | default([]) | length) == (service_state_definition.user_services | default([]) | unique | length)
          - (service_state_definition.services | default([]) | intersect(service_state_definition.user_services | default([])) | length) == 0
        fail_msg: The selected target, destination host count, catalog paths, or service scopes are invalid.

    - name: Validate managed service-state ownership metadata
      ansible.builtin.assert:
        that:
          - item.path is string
          - item.path | length > 0
          - item.path is match('^/')
          - item.owner is defined
          - item.owner is string
          - item.owner | length > 0
          - item.group is defined
          - item.group is string
          - item.group | length > 0
          - item.recurse is boolean
        fail_msg: Every managed path must declare absolute path, owner, group, and Boolean recurse values.
      loop: "{{ service_state_definition.paths }}"

    - name: Set service-state restore archive paths
      ansible.builtin.set_fact:
        service_state_local_dir: "{{ service_state_backup_root }}/{{ service_state_service }}"
        service_state_remote_archive_root: >-
          {{ service_state_definition.backup_staging_root | default('/tmp') }}
        service_state_remote_restore: >-
          {{ (service_state_definition.backup_staging_root | default('/tmp')) ~
             '/' ~ service_state_service ~ '-state-restore-' ~ service_state_timestamp ~ '.tar.gz' }}
        service_state_remote_pre_restore: >-
          {{ (service_state_definition.backup_staging_root | default('/tmp')) ~
             '/' ~ service_state_service ~ '-state-pre-restore-' ~ service_state_timestamp ~ '.tar.gz' }}
        service_state_local_pre_restore: >-
          {{ service_state_backup_root }}/{{ service_state_service }}/{{ service_state_service }}-state-pre-restore-{{ service_state_timestamp }}.tar.gz

    - name: Set device-local restore archive paths
      ansible.builtin.set_fact:
        service_state_device_backup_root: "{{ service_state_definition.device_backup_root }}"
        service_state_device_latest_archive: "{{ service_state_definition.device_backup_root }}/latest.tar"
        service_state_device_restore_source: >-
          {{ service_state_definition.device_backup_root ~ '/' ~
             ('latest.tar' if service_state_restore_file == 'latest' else service_state_restore_file) }}
        service_state_device_restore_checksum: >-
          {{ service_state_definition.device_backup_root ~ '/' ~
             ('latest.tar' if service_state_restore_file == 'latest' else service_state_restore_file) ~ '.sha256' }}
        service_state_device_restore_pinned: >-
          {{ service_state_definition.device_backup_root ~ '/.restore-' ~ service_state_timestamp ~
             ('.tar.gz' if service_state_restore_file.endswith('.tar.gz') else '.tar') }}
        service_state_device_pre_restore: >-
          {{ service_state_definition.device_backup_root ~ '/' ~ service_state_service ~ '-state-pre-restore-' ~ service_state_timestamp ~ '.tar' }}
        service_state_device_pre_restore_temporary: >-
          {{ service_state_definition.device_backup_root ~ '/.' ~ service_state_service ~ '-state-pre-restore-' ~ service_state_timestamp ~ '.tar.tmp' }}
        service_state_device_pre_restore_history_name: "{{ service_state_service }}-state-pre-restore-{{ service_state_timestamp }}.tar.gz"
        service_state_device_compression_unit: >-
          service-state-compress-{{ service_state_service }}-pre-restore-{{ service_state_timestamp }}.service
      when: service_state_uses_device_backup | bool

    - name: Select effective service-state restore archive
      ansible.builtin.set_fact:
        service_state_effective_restore_archive: >-
          {{ service_state_device_restore_pinned
             if service_state_restore_uses_device_archive | bool
             else service_state_remote_restore }}

    - name: Create private device-local service-state backup directory
      ansible.builtin.file:
        path: "{{ service_state_device_backup_root }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      when: service_state_uses_device_backup | bool

    - name: Deploy device-local service-state archive validator
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../scripts/validate-service-state-archive.py"
        dest: "{{ service_state_device_backup_root }}/validate-service-state-archive.py"
        owner: root
        group: root
        mode: "0700"
      when: service_state_uses_device_backup | bool

    - name: Deploy device-local service-state compression helper
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../scripts/compress-service-state-backup.py"
        dest: "{{ service_state_device_backup_root }}/compress-service-state-backup.py"
        owner: root
        group: root
        mode: "0700"
      when: service_state_uses_device_backup | bool

    - name: Check local service-state restore archive exists
      ansible.builtin.stat:
        path: "{{ service_state_restore_file }}"
      register: service_state_restore_stat
      delegate_to: localhost
      become: false
      when: not (service_state_restore_uses_device_archive | bool)

    - name: Fail when local service-state restore archive is missing
      ansible.builtin.fail:
        msg: "Service-state restore archive {{ service_state_restore_file }} does not exist."
      when:
        - not (service_state_restore_uses_device_archive | bool)
        - not service_state_restore_stat.stat.exists

    - name: Check local service-state restore checksum sidecar exists
      ansible.builtin.stat:
        path: "{{ service_state_restore_file }}.sha256"
      register: service_state_restore_checksum_stat
      delegate_to: localhost
      become: false
      when: not (service_state_restore_uses_device_archive | bool)

    - name: Require local service-state restore checksum sidecar
      ansible.builtin.assert:
        that:
          - service_state_restore_checksum_stat.stat.isreg | default(false)
        fail_msg: >-
          Service-state restore requires the archive checksum sidecar
          {{ service_state_restore_file }}.sha256.
      when: not (service_state_restore_uses_device_archive | bool)

    - name: Check selected device-local service-state archive exists
      ansible.builtin.stat:
        path: "{{ service_state_device_restore_source }}"
      register: service_state_device_restore_stat
      when: service_state_restore_uses_device_archive | bool

    - name: Check selected device-local service-state checksum exists
      ansible.builtin.stat:
        path: "{{ service_state_device_restore_checksum }}"
      register: service_state_device_restore_checksum_stat
      when: service_state_restore_uses_device_archive | bool

    - name: Require selected device-local archive and checksum
      ansible.builtin.assert:
        that:
          - service_state_device_restore_stat.stat.isreg | default(false)
          - service_state_device_restore_checksum_stat.stat.isreg | default(false)
        fail_msg: >-
          The selected device-local archive and its SHA-256 sidecar must both exist.
      when: service_state_restore_uses_device_archive | bool

    - name: Pin selected device-local archive for this restore
      ansible.builtin.command:
        argv:
          - ln
          - --
          - "{{ service_state_device_restore_source }}"
          - "{{ service_state_device_restore_pinned }}"
      changed_when: true
      when: service_state_restore_uses_device_archive | bool

    - name: Calculate pinned device-local archive checksum
      ansible.builtin.command:
        argv:
          - sha256sum
          - "{{ service_state_device_restore_pinned }}"
      register: service_state_device_restore_actual_checksum
      changed_when: false
      when: service_state_restore_uses_device_archive | bool

    - name: Read selected device-local archive checksum
      ansible.builtin.slurp:
        src: "{{ service_state_device_restore_checksum }}"
      register: service_state_device_restore_expected_checksum
      when: service_state_restore_uses_device_archive | bool

    - name: Verify pinned device-local archive checksum
      ansible.builtin.assert:
        that:
          - >-
            (service_state_device_restore_expected_checksum.content | b64decode).split() | length == 2
          - >-
            (service_state_device_restore_expected_checksum.content | b64decode).split()[0]
            == service_state_device_restore_actual_checksum.stdout.split()[0]
          - >-
            (service_state_device_restore_expected_checksum.content | b64decode).split()[1]
            == (service_state_device_restore_source | basename)
        fail_msg: The selected device-local archive checksum does not match.
      when: service_state_restore_uses_device_archive | bool

    - name: Validate service-state restore archive checksum
      ansible.builtin.command:
        argv:
          - sha256sum
          - -c
          - "{{ service_state_restore_file }}.sha256"
      args:
        chdir: "{{ service_state_restore_file | dirname }}"
      changed_when: false
      delegate_to: localhost
      become: false
      when: not (service_state_restore_uses_device_archive | bool)

    - name: Validate service-state restore archive contents
      ansible.builtin.command:
        argv: >-
          {{ ['python', '/workspace/infra/ansible/scripts/validate-service-state-archive.py',
              '--archive', service_state_restore_file,
              '--target', service_state_service,
              '--paths-json', service_state_managed_paths | to_json]
             + (['--require-all-paths']
                if service_state_definition.restore_require_all_paths | default(false) | bool
                else []) }}
      changed_when: false
      delegate_to: localhost
      become: false
      when: not (service_state_restore_uses_device_archive | bool)

    - name: Validate pinned device-local service-state archive contents
      ansible.builtin.command:
        argv: >-
          {{ ['/usr/bin/python3', service_state_device_backup_root ~ '/validate-service-state-archive.py',
              '--archive', service_state_device_restore_pinned,
              '--target', service_state_service,
              '--paths-json', service_state_managed_paths | to_json]
             + (['--require-all-paths']
                if service_state_definition.restore_require_all_paths | default(false) | bool
                else []) }}
      changed_when: false
      when: service_state_restore_uses_device_archive | bool

    - name: Validate managed service-state users exist
      ansible.builtin.command:
        argv:
          - getent
          - passwd
          - "{{ item }}"
      loop: "{{ service_state_managed_users }}"
      changed_when: false

    - name: Validate managed service-state groups exist
      ansible.builtin.command:
        argv:
          - getent
          - group
          - "{{ item }}"
      loop: "{{ service_state_managed_groups }}"
      changed_when: false

    - name: Resolve service-state user service owner UID
      ansible.builtin.command:
        argv:
          - id
          - -u
          - "{{ service_state_definition.user_service_owner }}"
      register: service_state_user_service_uid
      changed_when: false
      when: service_state_definition.user_services | default([]) | length > 0

    - name: Ensure local service-state backup directory exists
      ansible.builtin.file:
        path: "{{ service_state_local_dir }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false
      when: not (service_state_uses_device_backup | bool)

    - name: Check existing managed service-state paths before restore
      ansible.builtin.stat:
        path: "{{ item.path }}"
      loop: "{{ service_state_definition.paths }}"
      register: service_state_existing_path_stats

    - name: Build existing pre-restore path lists
      ansible.builtin.set_fact:
        service_state_existing_paths: >-
          {{ service_state_existing_path_stats.results
             | selectattr('stat.exists')
             | map(attribute='item.path')
             | list }}
        service_state_existing_archive_paths: >-
          {{ service_state_existing_path_stats.results
             | selectattr('stat.exists')
             | map(attribute='item.path')
             | map('regex_replace', '^/', '')
             | list }}

    - name: Initialize pre-restore staging source size
      ansible.builtin.set_fact:
        service_state_pre_restore_source_kib: 0

    - name: Calculate pre-restore managed service-state source size
      ansible.builtin.command:
        argv:
          - du
          - --apparent-size
          - -sk
          - --
          - "{{ item }}"
      loop: "{{ service_state_existing_paths }}"
      register: service_state_pre_restore_source_sizes
      changed_when: false
      when: service_state_existing_paths | length > 0

    - name: Calculate pre-restore staging source size total
      ansible.builtin.set_fact:
        service_state_pre_restore_source_kib: >-
          {{ service_state_pre_restore_source_sizes.results
             | map(attribute='stdout')
             | map('regex_replace', '\\s.*$', '')
             | map('int')
             | sum }}
      when: service_state_existing_paths | length > 0

    - name: Calculate conservative generic pre-restore archive capacity
      ansible.builtin.set_fact:
        service_state_pre_restore_required_kib: >-
          {{ [((service_state_pre_restore_source_kib | int * 5 / 4) | round(0, 'ceil') | int),
              (((service_state_restore_stat.stat.size | int + 1023) / 1024) | round(0, 'ceil') | int)]
             | max + 1048576 }}
      when: not (service_state_uses_device_backup | bool)

    - name: Calculate device-local pre-restore archive capacity
      ansible.builtin.set_fact:
        service_state_device_pre_restore_required_kib: >-
          {{ (service_state_pre_restore_source_kib | int * 2) + 1048576 }}
      when: service_state_uses_device_backup | bool

    - name: Create private pre-restore service-state staging directory
      ansible.builtin.file:
        path: "{{ service_state_definition.backup_staging_root }}"
        state: directory
        owner: "{{ service_state_definition.user_service_owner | default('root') }}"
        group: "{{ service_state_definition.user_service_owner | default('root') }}"
        mode: "0700"
      when:
        - service_state_definition.backup_staging_root is defined
        - not (service_state_restore_uses_device_archive | bool)

    - name: Check free space for generic pre-restore staging
      ansible.builtin.command:
        argv:
          - df
          - -Pk
          - "{{ service_state_remote_archive_root }}"
      register: service_state_pre_restore_staging_space
      changed_when: false
      when: not (service_state_uses_device_backup | bool)

    - name: Require conservative free space for generic pre-restore staging
      ansible.builtin.assert:
        that:
          - (service_state_pre_restore_staging_space.stdout_lines[-1].split())[3] | int >= service_state_pre_restore_required_kib | int
        fail_msg: >-
          Pre-restore staging needs at least {{ service_state_pre_restore_required_kib }} KiB
          free for {{ service_state_service }}; {{ (service_state_pre_restore_staging_space.stdout_lines[-1].split())[3] }} KiB is available.
      when: not (service_state_uses_device_backup | bool)

    - name: Check free space for device-local pre-restore backup
      ansible.builtin.command:
        argv:
          - df
          - -Pk
          - "{{ service_state_device_backup_root }}"
      register: service_state_device_pre_restore_space
      changed_when: false
      when: service_state_uses_device_backup | bool

    - name: Require capacity for atomic device-local pre-restore backup and compression
      ansible.builtin.assert:
        that:
          - >-
            (service_state_device_pre_restore_space.stdout_lines[-1].split())[3] | int >=
            service_state_device_pre_restore_required_kib | int
        fail_msg: >-
          Device-local pre-restore backup needs at least
          {{ service_state_device_pre_restore_required_kib }} KiB free for atomic archive creation
          and background compression;
          {{ (service_state_device_pre_restore_space.stdout_lines[-1].split())[3] }} KiB is available.
      when: service_state_uses_device_backup | bool

    - name: Check free space for device-local controller archive staging
      ansible.builtin.command:
        argv:
          - df
          - -Pk
          - "{{ service_state_remote_archive_root }}"
      register: service_state_device_restore_staging_space
      changed_when: false
      when:
        - service_state_uses_device_backup | bool
        - not (service_state_restore_uses_device_archive | bool)

    - name: Require capacity for device-local controller archive staging
      ansible.builtin.assert:
        that:
          - >-
            (service_state_device_restore_staging_space.stdout_lines[-1].split())[3] | int >=
            (((service_state_restore_stat.stat.size | int + 1023) / 1024) | round(0, 'ceil') | int) + 1048576
        fail_msg: >-
          Controller archive staging needs at least one archive plus 1 GiB free for
          {{ service_state_service }}.
      when:
        - service_state_uses_device_backup | bool
        - not (service_state_restore_uses_device_archive | bool)

    - name: Initialize pre-restore recovery and mutation status
      ansible.builtin.set_fact:
        service_state_recovery_ready: false
        service_state_restore_mutation_started: false

    - name: Restore service state after successful preflight and stops
      block:
        - name: Stop managed system services before restore
          ansible.builtin.systemd_service:
            name: "{{ item }}"
            state: stopped
          loop: "{{ service_state_definition.services | default([]) }}"

        - name: Stop managed user services before restore
          become: true
          become_user: "{{ service_state_definition.user_service_owner }}"
          ansible.builtin.systemd_service:
            name: "{{ item }}"
            scope: user
            state: stopped
          environment:
            XDG_RUNTIME_DIR: "/run/user/{{ service_state_user_service_uid.stdout | trim }}"
          loop: "{{ service_state_definition.user_services | default([]) }}"
          when: service_state_definition.user_services | default([]) | length > 0

        - name: Create temporary pre-restore service-state manifest directory
          ansible.builtin.tempfile:
            state: directory
            suffix: "{{ service_state_service }}-pre-restore-manifest"
          register: service_state_pre_restore_manifest_dir
          when:
            - service_state_existing_paths | length > 0
            - not (service_state_uses_device_backup | bool)

        - name: Create temporary device-local pre-restore service-state manifest directory
          ansible.builtin.tempfile:
            state: directory
            path: "{{ service_state_device_backup_root }}"
            prefix: ".{{ service_state_service }}-pre-restore-manifest-"
          register: service_state_pre_restore_manifest_dir
          when:
            - service_state_existing_paths | length > 0
            - service_state_uses_device_backup | bool

        - name: Write pre-restore service-state manifest
          ansible.builtin.copy:
            dest: "{{ service_state_pre_restore_manifest_dir.path }}/MANIFEST.json"
            mode: "0600"
            content: |
              {
                "schema_version": 1,
                "target": {{ service_state_service | to_json }},
                "archive_kind": "pre_restore",
                "created_utc": {{ service_state_timestamp | to_json }},
                "description": {{ service_state_definition.description | default('') | to_json }},
                "paths": {{ service_state_existing_paths | to_json }}
              }
          when: service_state_existing_paths | length > 0

        - name: Create pre-restore service-state archive directly from managed paths
          ansible.builtin.command:
            argv: >-
              {{ ['tar', '--numeric-owner', '-czf', service_state_remote_pre_restore,
                  '-C', service_state_pre_restore_manifest_dir.path, 'MANIFEST.json', '-C', '/']
                 + service_state_existing_archive_paths }}
          changed_when: true
          when:
            - service_state_existing_paths | length > 0
            - not (service_state_uses_device_backup | bool)

        - name: Create uncompressed temporary device-local pre-restore archive
          ansible.builtin.command:
            argv: >-
              {{ ['tar', '--numeric-owner', '-cf', service_state_device_pre_restore_temporary,
                  '-C', service_state_pre_restore_manifest_dir.path, 'MANIFEST.json', '-C', '/']
                 + service_state_existing_archive_paths }}
          changed_when: true
          when:
            - service_state_existing_paths | length > 0
            - service_state_uses_device_backup | bool

        - name: Restrict temporary device-local pre-restore archive permissions
          ansible.builtin.file:
            path: "{{ service_state_device_pre_restore_temporary }}"
            mode: "0600"
          when:
            - service_state_existing_paths | length > 0
            - service_state_uses_device_backup | bool

        - name: Atomically save device-local pre-restore archive
          ansible.builtin.command:
            argv:
              - mv
              - -f
              - "{{ service_state_device_pre_restore_temporary }}"
              - "{{ service_state_device_pre_restore }}"
          changed_when: true
          when:
            - service_state_existing_paths | length > 0
            - service_state_uses_device_backup | bool

        - name: Calculate device-local pre-restore archive checksum
          ansible.builtin.command:
            argv:
              - sha256sum
              - "{{ service_state_device_pre_restore }}"
          register: service_state_device_pre_restore_checksum
          changed_when: false
          when:
            - service_state_existing_paths | length > 0
            - service_state_uses_device_backup | bool

        - name: Publish device-local pre-restore archive checksum
          ansible.builtin.copy:
            dest: "{{ service_state_device_pre_restore }}.sha256"
            owner: root
            group: root
            mode: "0600"
            content: "{{ service_state_device_pre_restore_checksum.stdout.split()[0] }}  {{ service_state_device_pre_restore | basename }}\n"
          when:
            - service_state_existing_paths | length > 0
            - service_state_uses_device_backup | bool

        - name: Stream pre-restore service-state archive into private values
          ansible.builtin.command:
            argv: >-
              {{ ['python', '/workspace/infra/ansible/scripts/fetch-service-state.py',
                  '--host', ansible_host, '--user', ansible_user,
                  '--ssh-common-args', ansible_ssh_common_args | default(''),
                  '--remote', service_state_remote_pre_restore,
                  '--allowed-remote-root', service_state_remote_archive_root,
                  '--output', service_state_local_pre_restore]
                 + (['--become'] if ansible_become | default(false) | bool else []) }}
          changed_when: true
          delegate_to: localhost
          become: false
          when:
            - service_state_existing_paths | length > 0
            - not (service_state_uses_device_backup | bool)

        - name: Restrict local pre-restore service-state archive permissions
          ansible.builtin.file:
            path: "{{ service_state_local_pre_restore }}"
            mode: "0600"
          delegate_to: localhost
          become: false
          when:
            - service_state_existing_paths | length > 0
            - not (service_state_uses_device_backup | bool)

        - name: Calculate local pre-restore service-state archive checksum
          ansible.builtin.command:
            argv:
              - sha256sum
              - "{{ service_state_local_pre_restore }}"
          register: service_state_pre_restore_checksum
          changed_when: false
          delegate_to: localhost
          become: false
          when:
            - service_state_existing_paths | length > 0
            - not (service_state_uses_device_backup | bool)

        - name: Write local pre-restore service-state checksum
          ansible.builtin.copy:
            dest: "{{ service_state_local_pre_restore }}.sha256"
            mode: "0600"
            content: "{{ service_state_pre_restore_checksum.stdout }}\n"
          delegate_to: localhost
          become: false
          when:
            - service_state_existing_paths | length > 0
            - not (service_state_uses_device_backup | bool)

        - name: Validate local pre-restore service-state archive contents
          ansible.builtin.command:
            argv: >-
              {{ ['python', '/workspace/infra/ansible/scripts/validate-service-state-archive.py',
                  '--archive', service_state_local_pre_restore,
                  '--target', service_state_service,
                  '--paths-json', service_state_managed_paths | to_json]
                 + (['--require-all-paths']
                    if service_state_definition.restore_require_all_paths | default(false) | bool
                    else []) }}
          changed_when: false
          delegate_to: localhost
          become: false
          when:
            - service_state_existing_paths | length > 0
            - not (service_state_uses_device_backup | bool)

        - name: Validate device-local pre-restore service-state archive contents
          ansible.builtin.command:
            argv: >-
              {{ ['/usr/bin/python3', service_state_device_backup_root ~ '/validate-service-state-archive.py',
                  '--archive', service_state_device_pre_restore,
                  '--target', service_state_service,
                  '--paths-json', service_state_managed_paths | to_json]
                 + (['--require-all-paths']
                    if service_state_definition.restore_require_all_paths | default(false) | bool
                    else []) }}
          changed_when: false
          when:
            - service_state_existing_paths | length > 0
            - service_state_uses_device_backup | bool

        - name: Mark pre-restore recovery archive as secured
          ansible.builtin.set_fact:
            service_state_recovery_ready: true
          when: service_state_existing_paths | length > 0

        - name: Remove streamed pre-restore archive from service host
          ansible.builtin.file:
            path: "{{ service_state_remote_pre_restore }}"
            state: absent
          when:
            - service_state_existing_paths | length > 0
            - not (service_state_uses_device_backup | bool)

        - name: Stream service-state restore archive into service staging
          ansible.builtin.command:
            argv: >-
              {{ ['python', '/workspace/infra/ansible/scripts/push-service-state.py',
                  '--host', ansible_host, '--user', ansible_user,
                  '--ssh-common-args', ansible_ssh_common_args | default(''),
                  '--remote', service_state_remote_restore,
                  '--allowed-remote-root', service_state_remote_archive_root,
                  '--input', service_state_restore_file]
                 + (['--become'] if ansible_become | default(false) | bool else []) }}
          changed_when: true
          delegate_to: localhost
          become: false
          when: not (service_state_restore_uses_device_archive | bool)

        - name: Mark destructive service-state restore mutation started
          ansible.builtin.set_fact:
            service_state_restore_mutation_started: true

        - name: Remove existing managed service-state paths before restore
          ansible.builtin.file:
            path: "{{ item.path }}"
            state: absent
          loop: "{{ service_state_definition.paths }}"

        - name: Restore managed service-state archive
          ansible.builtin.unarchive:
            src: "{{ service_state_effective_restore_archive }}"
            dest: /
            remote_src: true

        - name: Check restored managed service-state paths
          ansible.builtin.stat:
            path: "{{ item.path }}"
          loop: "{{ service_state_definition.paths }}"
          register: service_state_restored_path_stats

        - name: Apply catalog ownership to restored path roots
          ansible.builtin.file:
            path: "{{ item.item.path }}"
            owner: "{{ item.item.owner }}"
            group: "{{ item.item.group }}"
            follow: false
          loop: "{{ service_state_restored_path_stats.results }}"
          when: item.stat.exists

        - name: Apply recursive catalog ownership to restored directories
          ansible.builtin.file:
            path: "{{ item.item.path }}"
            state: directory
            owner: "{{ item.item.owner }}"
            group: "{{ item.item.group }}"
            recurse: true
            follow: false
          loop: "{{ service_state_restored_path_stats.results }}"
          when:
            - item.stat.exists
            - item.stat.isdir
            - item.item.recurse

        - name: Discover descendant symlinks in restored managed paths
          ansible.builtin.find:
            paths: "{{ item.item.path }}"
            recurse: true
            file_type: link
            follow: false
          loop: "{{ service_state_restored_path_stats.results }}"
          register: service_state_restored_symlink_stats
          when:
            - item.stat.exists
            - item.stat.isdir

        - name: Apply catalog ownership to restored symlinks
          ansible.builtin.file:
            path: "{{ item.1.path }}"
            owner: "{{ item.0.item.item.owner }}"
            group: "{{ item.0.item.item.group }}"
            follow: false
          loop: "{{ service_state_restored_symlink_stats.results | subelements('files', skip_missing=True) }}"

        - name: Restart managed user services after restore
          become: true
          become_user: "{{ service_state_definition.user_service_owner }}"
          ansible.builtin.systemd_service:
            name: "{{ item }}"
            scope: user
            state: started
            enabled: true
            daemon_reload: true
          environment:
            XDG_RUNTIME_DIR: "/run/user/{{ service_state_user_service_uid.stdout | trim }}"
          loop: "{{ service_state_definition.user_services | default([]) | reverse | list }}"
          when: service_state_definition.user_services | default([]) | length > 0

        - name: Restart managed system services after restore
          ansible.builtin.systemd_service:
            name: "{{ item }}"
            state: started
            enabled: true
            daemon_reload: true
          loop: "{{ service_state_definition.services | default([]) | reverse | list }}"

        - name: Verify Onclave health after restore
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ onclave_onramp_core_port | default(18080) }}/health"
            status_code: 200
            return_content: true
          register: service_state_onclave_health
          retries: 30
          delay: 2
          until:
            - service_state_onclave_health.status == 200
            - service_state_onclave_health.json.status | default('') == 'ok'
            - service_state_onclave_health.json.broker.connected | default(false) | bool
          when: service_state_service == 'onclave_onramp'

        - name: Verify Onclave dependency readiness after restore
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ onclave_onramp_core_port | default(18080) }}/ready"
            status_code: 200
            return_content: true
          register: service_state_onclave_ready
          retries: 30
          delay: 2
          until:
            - service_state_onclave_ready.status == 200
            - service_state_onclave_ready.json.status | default('') == 'ready'
            - service_state_onclave_ready.json.checks.postgres | default('') == 'ok'
            - service_state_onclave_ready.json.checks.s3 | default('') == 'ok'
            - service_state_onclave_ready.json.checks.ollama | default('') == 'ok'
          when: service_state_service == 'onclave_onramp'

      rescue:
        - name: Report restore failure recovery details
          ansible.builtin.debug:
            msg: >-
              Restore failed {{ 'after destructive managed path removal; services will be kept stopped.'
              if service_state_restore_mutation_started | bool
              else 'before destructive managed path removal; originally managed services will be restarted.' }}
              Recovery archive: {{ (service_state_device_pre_restore
              if service_state_uses_device_backup | bool
              else service_state_local_pre_restore)
              if service_state_recovery_ready
              else 'not available (no prior paths or failure before recovery archive was secured)' }};
              checksum: {{ ((service_state_device_pre_restore ~ '.sha256')
              if service_state_uses_device_backup | bool
              else (service_state_local_pre_restore ~ '.sha256'))
              if service_state_recovery_ready else 'not available' }}.

        - name: Restart managed user services after pre-mutation restore failure
          become: true
          become_user: "{{ service_state_definition.user_service_owner }}"
          ansible.builtin.systemd_service:
            name: "{{ item }}"
            scope: user
            state: started
            enabled: true
            daemon_reload: true
          environment:
            XDG_RUNTIME_DIR: "/run/user/{{ service_state_user_service_uid.stdout | trim }}"
          loop: "{{ service_state_definition.user_services | default([]) | reverse | list }}"
          when:
            - not (service_state_restore_mutation_started | bool)
            - service_state_definition.user_services | default([]) | length > 0

        - name: Restart managed system services after pre-mutation restore failure
          ansible.builtin.systemd_service:
            name: "{{ item }}"
            state: started
            enabled: true
            daemon_reload: true
          loop: "{{ service_state_definition.services | default([]) | reverse | list }}"
          when: not (service_state_restore_mutation_started | bool)

        - name: Keep managed system services stopped after destructive restore failure
          ansible.builtin.systemd_service:
            name: "{{ item }}"
            state: stopped
          loop: "{{ service_state_definition.services | default([]) }}"
          when: service_state_restore_mutation_started | bool

        - name: Keep managed user services stopped after destructive restore failure
          become: true
          become_user: "{{ service_state_definition.user_service_owner }}"
          ansible.builtin.systemd_service:
            name: "{{ item }}"
            scope: user
            state: stopped
          environment:
            XDG_RUNTIME_DIR: "/run/user/{{ service_state_user_service_uid.stdout | trim }}"
          loop: "{{ service_state_definition.user_services | default([]) }}"
          when:
            - service_state_restore_mutation_started | bool
            - service_state_definition.user_services | default([]) | length > 0

        - name: Fail managed service-state restore
          ansible.builtin.fail:
            msg: Managed service-state restore failed; see the recovery archive and service-state result above.
      always:
        - name: Remove temporary pre-restore service-state manifest directory
          ansible.builtin.file:
            path: "{{ service_state_pre_restore_manifest_dir.path }}"
            state: absent
          when: service_state_pre_restore_manifest_dir.path is defined

        - name: Remove partial pre-restore service-state archive from service host
          ansible.builtin.file:
            path: "{{ service_state_remote_pre_restore }}"
            state: absent
          when: not (service_state_uses_device_backup | bool)

        - name: Remove partial temporary device-local pre-restore archive
          ansible.builtin.file:
            path: "{{ service_state_device_pre_restore_temporary }}"
            state: absent
          when: service_state_uses_device_backup | bool

        - name: Remove partial service-state restore archive from service host
          ansible.builtin.file:
            path: "{{ service_state_remote_restore }}"
            state: absent
          when: not (service_state_restore_uses_device_archive | bool)

        - name: Remove pinned device-local restore archive
          ansible.builtin.file:
            path: "{{ service_state_device_restore_pinned }}"
            state: absent
          when: service_state_restore_uses_device_archive | bool

        - name: Remove private pre-restore service-state staging directory
          ansible.builtin.file:
            path: "{{ service_state_definition.backup_staging_root }}"
            state: absent
          when:
            - service_state_definition.backup_staging_root is defined
            - not (service_state_restore_uses_device_archive | bool)

    - name: Launch device-local pre-restore compression
      ansible.builtin.command:
        argv:
          - systemd-run
          - --quiet
          - --no-block
          - --collect
          - "--unit={{ service_state_device_compression_unit }}"
          - --service-type=exec
          - --property=UMask=0077
          - /usr/bin/python3
          - "{{ service_state_device_backup_root }}/compress-service-state-backup.py"
          - --backup-root
          - "{{ service_state_device_backup_root }}"
          - --pending
          - "{{ service_state_device_pre_restore }}"
          - --history-name
          - "{{ service_state_device_pre_restore_history_name }}"
          - --retention
          - "{{ service_state_definition.backup_retention_count | string }}"
      changed_when: true
      when:
        - service_state_uses_device_backup | bool
        - service_state_existing_paths | length > 0

    - name: Report generic service-state restore result
      ansible.builtin.debug:
        msg: >-
          {{ service_state_service }} state restored from {{ service_state_restore_file }};
          pre-restore backup {{ service_state_local_pre_restore
          if service_state_existing_paths | length > 0
          else 'not created because no previous state existed' }}.
      when: not (service_state_uses_device_backup | bool)

    - name: Report device-local service-state restore result
      ansible.builtin.debug:
        msg: >-
          {{ service_state_service }} state restored from {{ service_state_restore_file }};
          pre-restore backup {{ service_state_device_pre_restore
          if service_state_existing_paths | length > 0
          else 'not created because no previous state existed' }}
          {{ ('was queued for background compression as ' ~
              service_state_device_pre_restore_history_name ~ '.')
          if service_state_existing_paths | length > 0
          else '' }}
      when: service_state_uses_device_backup | bool
