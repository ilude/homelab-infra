---
- name: Validate managed LXC root password
  ansible.builtin.assert:
    that:
      - lookup('env', 'TF_VAR_lxc_root_password') | length >= 8
      - lookup('env', 'TF_VAR_lxc_root_password') is not search('REPLACE_WITH_')
    fail_msg: TF_VAR_lxc_root_password must contain the private managed LXC root password.
  no_log: true

- name: Rotate managed LXC root password
  ansible.builtin.user:
    name: root
    password: "{{ lookup('env', 'TF_VAR_lxc_root_password') | password_hash('sha512', lxc_credentials_root_password_hash_salt) }}"
    update_password: always
  no_log: true
