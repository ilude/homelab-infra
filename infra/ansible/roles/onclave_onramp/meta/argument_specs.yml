---
argument_specs:
  main:
    short_description: "Deploy the unified Onclave app definition on the shared onramp host."
    options:
      onramp_host_deploy_user:
        type: str
        required: true
        description: "Rootless deploy user inherited from onramp host setup."
      onramp_host_deploy_dir:
        type: str
        required: true
        description: "Base deployment directory inherited from onramp host setup."
      onclave_server_name:
        type: str
        required: true
        description: "Caddy server name for the unified Onclave API."
      onclave_source_git_sha:
        type: str
        required: true
        description: "Immutable Onclave source revision used by the app definition and health gate."
      onclave_app_definition_url:
        type: str
        required: true
        description: "Commit-pinned raw URL for Onclave's reusable Compose definition."
      onclave_app_definition_sha256:
        type: str
        required: true
        description: "SHA-256 checksum for the reusable Compose definition."
      onclave_backup_script_sha256:
        type: str
        required: true
        description: "SHA-256 checksum for the pinned PostgreSQL backup helper."
      onclave_restore_script_sha256:
        type: str
        required: true
        description: "SHA-256 checksum for the pinned PostgreSQL restore helper."
      onclave_rabbitmq_image:
        type: str
        required: true
        description: "Digest-pinned RabbitMQ management image."
      onclave_core_image_repository:
        type: str
        required: true
        description: "Onclave core image repository without tag or digest."
      onclave_core_image_tag:
        type: str
        required: true
        description: "Immutable Onclave source commit tag."
      onclave_core_image_digest:
        type: str
        required: true
        description: "Onclave core image digest in sha256 form."
      onclave_postgres_image:
        type: str
        required: true
        description: "Digest-pinned PostgreSQL pgvector image."
      onclave_minio_image:
        type: str
        required: true
        description: "Digest-pinned MinIO image."
      onclave_ollama_image:
        type: str
        required: true
        description: "Digest-pinned Ollama image."
      onclave_searxng_image:
        type: str
        required: true
        description: "Digest-pinned SearXNG image."
      onclave_docling_image:
        type: str
        required: true
        description: "Digest-pinned Docling Serve image."
      onclave_rabbitmq_default_user:
        type: str
        required: true
        description: "RabbitMQ application user from private values."
      onclave_rabbitmq_default_pass:
        type: str
        required: true
        description: "RabbitMQ application password from private values."
      onclave_onramp_authorized_keys:
        type: list
        elements: str
        required: true
        description: "RFC 9421 public authorization keys for Onclave."
      onclave_onramp_postgres_password:
        type: str
        required: true
      onclave_onramp_postgres_database:
        type: str
        required: true
      onclave_onramp_postgres_user:
        type: str
        required: true
      onclave_onramp_s3_access_key:
        type: str
        required: true
      onclave_onramp_s3_secret_key:
        type: str
        required: true
      onclave_onramp_searxng_secret:
        type: str
        required: true
      onclave_onramp_webshare_proxy_username:
        type: str
        required: true
      onclave_onramp_webshare_proxy_password:
        type: str
        required: true
      onclave_onramp_youtube_api_key:
        type: str
        required: true
      onclave_onramp_openrouter_api_key:
        type: str
        required: true
      onclave_onramp_anthropic_api_key:
        type: str
        required: true
      onclave_onramp_base_dir:
        type: str
        required: false
      onclave_onramp_data_root:
        type: str
        required: false
        description: "Existing adopted data root; it is never moved or renamed."
      onclave_onramp_compose_provider_command:
        type: str
        required: false
      onclave_onramp_core_port:
        type: int
        required: false
      onclave_onramp_amqp_port:
        type: int
        required: false
      onclave_onramp_required_packages:
        type: list
        required: false
      onclave_onramp_s3_bucket:
        type: str
        required: false
      onclave_onramp_s3_region:
        type: str
        required: false
      onclave_onramp_openai_api_key:
        type: str
        required: false
      onclave_onramp_unified_pipeline_model:
        type: str
        required: false
      onclave_onramp_callback_url:
        type: str
        required: false
      onclave_onramp_callback_secret:
        type: str
        required: false
