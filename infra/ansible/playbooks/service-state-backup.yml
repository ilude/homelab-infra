---
- name: Back up managed service state to controller or device-local storage
  hosts: "{{ service_state_hosts | default('all') }}"
  gather_facts: false
  become: true
  vars_files:
    - ../vars/service-state.yml
  vars:
    service_state_backup_root: "{{ lookup('env', 'SERVICE_STATE_BACKUP_ROOT') | default('/workspace/values/service-backups', true) }}"
    service_state_host_acl_enforced: "{{ lookup('env', 'SERVICE_STATE_HOST_ACL_ENFORCED') | default('false', true) | bool }}"
  tasks:
    - name: Validate service-state backup input
      ansible.builtin.assert:
        that:
          - service_state_service is defined
          - service_state_service in managed_service_state_catalog
          - service_state_hosts is defined
        fail_msg: service_state_service and service_state_hosts are required for service state backup.

    - name: Select managed service-state definition
      ansible.builtin.set_fact:
        service_state_definition: "{{ managed_service_state_catalog[service_state_service] }}"
        service_state_timestamp: "{{ lookup('pipe', 'date -u +%Y%m%dT%H%M%S%NZ') }}"

    - name: Select service-state backup storage model
      ansible.builtin.set_fact:
        service_state_uses_device_backup: "{{ service_state_definition.device_backup_root is defined }}"

    - name: Validate service-state backup quiescing configuration
      ansible.builtin.assert:
        that:
          - service_state_definition.backup_quiesce_user_services | default(false) is boolean
          - >-
            not (service_state_definition.backup_quiesce_user_services | default(false) | bool) or
            (service_state_definition.user_services | default([]) | length > 0)
          - >-
            not (service_state_definition.backup_quiesce_user_services | default(false) | bool) or
            (service_state_definition.user_service_owner | default('') | length > 0)
          - >-
            not (service_state_definition.backup_quiesce_user_services | default(false) | bool) or
            (service_state_definition.backup_staging_root | default('') is string and
            service_state_definition.backup_staging_root | default('') is match('^/'))
        fail_msg: >-
          Backup user-service quiescing requires a Boolean flag, configured user
          services, a user service owner, and an absolute private staging root.

    - name: Validate device-local backup configuration
      ansible.builtin.assert:
        that:
          - service_state_definition.device_backup_root is string
          - service_state_definition.device_backup_root is match('^/')
          - service_state_definition.backup_retention_count is integer
          - service_state_definition.backup_retention_count | int > 0
        fail_msg: >-
          Device-local backups require an absolute backup root and a positive
          integer retention count.
      when: service_state_uses_device_backup | bool

    - name: Set service-state backup archive paths
      ansible.builtin.set_fact:
        service_state_archive_name: "{{ service_state_service }}-state-{{ service_state_timestamp }}.tar.gz"
        service_state_local_dir: "{{ service_state_backup_root }}/{{ service_state_service }}"
        service_state_remote_archive_root: >-
          {{ service_state_definition.backup_staging_root
             if service_state_definition.backup_quiesce_user_services | default(false) | bool
             else '/tmp' }}
        service_state_remote_archive: >-
          {{ (service_state_definition.backup_staging_root
              if service_state_definition.backup_quiesce_user_services | default(false) | bool
              else '/tmp') ~ '/' ~ service_state_service ~ '-state-' ~ service_state_timestamp ~ '.tar.gz' }}

    - name: Set device-local backup paths
      ansible.builtin.set_fact:
        service_state_device_backup_root: "{{ service_state_definition.device_backup_root }}"
        service_state_device_latest_archive: "{{ service_state_definition.device_backup_root }}/latest.tar"
        service_state_device_latest_checksum: "{{ service_state_definition.device_backup_root }}/latest.tar.sha256"
        service_state_device_temporary_archive: >-
          {{ service_state_definition.device_backup_root ~ '/.latest.tar.' ~ service_state_timestamp ~ '.tmp' }}
        service_state_device_pending_archive: >-
          {{ service_state_definition.device_backup_root ~ '/' ~ service_state_service ~ '-state-pending-' ~ service_state_timestamp ~ '.tar' }}
        service_state_device_history_name: "{{ service_state_service }}-state-{{ service_state_timestamp }}.tar.gz"
        service_state_device_compression_unit: >-
          service-state-compress-{{ service_state_service }}-{{ service_state_timestamp }}.service
      when: service_state_uses_device_backup | bool

    - name: Ensure local service-state backup directory exists  # noqa risky-file-permissions
      ansible.builtin.file:
        path: "{{ service_state_local_dir }}"
        state: directory
      delegate_to: localhost
      become: false
      when: not (service_state_uses_device_backup | bool)

    - name: Restrict local service-state backup directory permissions when supported
      ansible.builtin.command:
        argv:
          - chmod
          - "0700"
          - "{{ service_state_local_dir }}"
      register: service_state_local_dir_chmod
      changed_when: service_state_local_dir_chmod.rc == 0
      failed_when: >-
        service_state_local_dir_chmod.rc != 0 and
        'Operation not permitted' not in service_state_local_dir_chmod.stderr
      delegate_to: localhost
      become: false
      when:
        - not (service_state_uses_device_backup | bool)
        - not service_state_host_acl_enforced

    - name: Confirm host ACL protection for local service-state backups
      ansible.builtin.debug:
        msg: The host filesystem ACL protects the private service-state backup tree.
      when:
        - not (service_state_uses_device_backup | bool)
        - service_state_host_acl_enforced
      delegate_to: localhost
      become: false

    - name: Report unsupported local service-state backup directory permissions
      ansible.builtin.debug:
        msg: >-
          The controller filesystem does not support enforcing POSIX mode 0700 on
          {{ service_state_local_dir }}; rely on host filesystem access controls.
      when:
        - not (service_state_uses_device_backup | bool)
        - not service_state_host_acl_enforced
        - service_state_local_dir_chmod.rc | default(0) != 0
      delegate_to: localhost
      become: false

    - name: Check managed service-state paths
      ansible.builtin.stat:
        path: "{{ item.path }}"
      loop: "{{ service_state_definition.paths }}"
      register: service_state_path_stats

    - name: Build existing managed service-state path list
      ansible.builtin.set_fact:
        service_state_existing_paths: >-
          {{ service_state_path_stats.results
             | selectattr('stat.exists')
             | map(attribute='item.path')
             | list }}
        service_state_existing_archive_paths: >-
          {{ service_state_path_stats.results
             | selectattr('stat.exists')
             | map(attribute='item.path')
             | map('regex_replace', '^/', '')
             | list }}

    - name: Fail when no managed service-state paths exist
      ansible.builtin.fail:
        msg: "None of the configured state paths exist for {{ service_state_service }}."
      when: service_state_existing_paths | length == 0

    - name: Fail strict backup when managed service-state paths are missing
      ansible.builtin.assert:
        that:
          - service_state_existing_paths | length == service_state_definition.paths | length
        fail_msg: >-
          Strict backup for {{ service_state_service }} requires every configured
          managed path to exist before quiescing services.
      when: service_state_definition.restore_require_all_paths | default(false) | bool

    - name: Calculate quiesced backup source size
      ansible.builtin.command:
        argv:
          - du
          - --apparent-size
          - -sk
          - --
          - "{{ item }}"
      loop: "{{ service_state_existing_paths }}"
      register: service_state_backup_source_sizes
      changed_when: false
      when: service_state_definition.backup_quiesce_user_services | default(false) | bool

    - name: Calculate quiesced backup source size total
      ansible.builtin.set_fact:
        service_state_backup_source_kib: >-
          {{ service_state_backup_source_sizes.results
             | map(attribute='stdout')
             | map('regex_replace', '\\s.*$', '')
             | map('int')
             | sum }}
      when: service_state_definition.backup_quiesce_user_services | default(false) | bool

    - name: Calculate generic quiesced backup space requirement
      ansible.builtin.set_fact:
        service_state_backup_required_kib: >-
          {{ ((service_state_backup_source_kib | int * 5 / 4) | round(0, 'ceil') | int) + 1048576 }}
      when:
        - service_state_definition.backup_quiesce_user_services | default(false) | bool
        - not (service_state_uses_device_backup | bool)

    - name: Check free space for generic quiesced backup staging
      ansible.builtin.command:
        argv:
          - df
          - -Pk
          - "{{ service_state_definition.backup_staging_root | dirname }}"
      register: service_state_backup_staging_space
      changed_when: false
      when:
        - service_state_definition.backup_quiesce_user_services | default(false) | bool
        - not (service_state_uses_device_backup | bool)

    - name: Require conservative free space for generic quiesced backup staging
      ansible.builtin.assert:
        that:
          - (service_state_backup_staging_space.stdout_lines[-1].split())[3] | int >= service_state_backup_required_kib | int
        fail_msg: >-
          Quiesced backup staging needs at least {{ service_state_backup_required_kib }} KiB
          free for {{ service_state_service }}; {{ (service_state_backup_staging_space.stdout_lines[-1].split())[3] }} KiB is available.
      when:
        - service_state_definition.backup_quiesce_user_services | default(false) | bool
        - not (service_state_uses_device_backup | bool)

    - name: Create private device-local service-state backup directory
      ansible.builtin.file:
        path: "{{ service_state_device_backup_root }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      when: service_state_uses_device_backup | bool

    - name: Deploy device-local service-state archive validator
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../scripts/validate-service-state-archive.py"
        dest: "{{ service_state_device_backup_root }}/validate-service-state-archive.py"
        owner: root
        group: root
        mode: "0700"
      when: service_state_uses_device_backup | bool

    - name: Deploy device-local service-state compression helper
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../scripts/compress-service-state-backup.py"
        dest: "{{ service_state_device_backup_root }}/compress-service-state-backup.py"
        owner: root
        group: root
        mode: "0700"
      when: service_state_uses_device_backup | bool

    - name: Calculate device-local backup space requirement
      ansible.builtin.set_fact:
        service_state_device_backup_required_kib: >-
          {{ (service_state_backup_source_kib | int * 2) + 1048576 }}
      when: service_state_uses_device_backup | bool

    - name: Check free space for device-local backup storage
      ansible.builtin.command:
        argv:
          - df
          - -Pk
          - "{{ service_state_device_backup_root }}"
      register: service_state_device_backup_space
      changed_when: false
      when: service_state_uses_device_backup | bool

    - name: Require capacity for atomic device-local backup and compression
      ansible.builtin.assert:
        that:
          - (service_state_device_backup_space.stdout_lines[-1].split())[3] | int >= service_state_device_backup_required_kib | int
        fail_msg: >-
          Device-local backup needs at least {{ service_state_device_backup_required_kib }} KiB
          free for atomic archive creation and background compression; {{ (service_state_device_backup_space.stdout_lines[-1].split())[3] }} KiB is available.
      when: service_state_uses_device_backup | bool

    - name: Resolve service-state backup user service owner UID
      ansible.builtin.command:
        argv:
          - id
          - -u
          - "{{ service_state_definition.user_service_owner }}"
      register: service_state_backup_user_service_uid
      changed_when: false
      when: service_state_definition.backup_quiesce_user_services | default(false) | bool

    - name: Initialize active user service list for backup
      ansible.builtin.set_fact:
        service_state_active_user_services: []

    - name: Create temporary service-state snapshot directory
      ansible.builtin.tempfile:
        state: directory
        suffix: "{{ service_state_service }}-state"
      register: service_state_snapshot_dir
      when: not (service_state_definition.backup_quiesce_user_services | default(false) | bool)

    - name: Snapshot non-quiesced managed service-state paths
      ansible.builtin.command:
        argv:
          - cp
          - --archive
          - --parents
          - "{{ item }}"
          - "{{ service_state_snapshot_dir.path }}/"
      loop: "{{ service_state_existing_paths }}"
      changed_when: true
      when: not (service_state_definition.backup_quiesce_user_services | default(false) | bool)

    - name: Write non-quiesced service-state backup manifest
      ansible.builtin.copy:
        dest: "{{ service_state_snapshot_dir.path }}/MANIFEST.json"
        mode: "0600"
        content: |
          {
            "schema_version": 1,
            "target": {{ service_state_service | to_json }},
            "archive_kind": "backup",
            "created_utc": {{ service_state_timestamp | to_json }},
            "description": {{ service_state_definition.description | default('') | to_json }},
            "paths": {{ service_state_existing_paths | to_json }}
          }
      when: not (service_state_definition.backup_quiesce_user_services | default(false) | bool)

    - name: Create non-quiesced service-state archive on service host
      ansible.builtin.command:
        argv: >-
          {{ ['tar', '--numeric-owner', '-C', service_state_snapshot_dir.path, '-czf',
              service_state_remote_archive, 'MANIFEST.json'] + service_state_existing_archive_paths }}
      changed_when: true
      when: not (service_state_definition.backup_quiesce_user_services | default(false) | bool)

    - name: Stream non-quiesced service-state archive into private values
      ansible.builtin.command:
        argv: >-
          {{ ['python', '/workspace/infra/ansible/scripts/fetch-service-state.py',
              '--host', ansible_host, '--user', ansible_user,
              '--ssh-common-args', ansible_ssh_common_args | default(''),
              '--remote', service_state_remote_archive,
              '--allowed-remote-root', service_state_remote_archive_root,
              '--output', service_state_local_dir ~ '/' ~ service_state_archive_name]
             + (['--become'] if ansible_become | default(false) | bool else []) }}
      changed_when: true
      delegate_to: localhost
      become: false
      when: not (service_state_definition.backup_quiesce_user_services | default(false) | bool)

    - name: Restrict non-quiesced local service-state archive permissions
      ansible.builtin.file:
        path: "{{ service_state_local_dir }}/{{ service_state_archive_name }}"
        mode: "0600"
      delegate_to: localhost
      become: false
      when: not (service_state_definition.backup_quiesce_user_services | default(false) | bool)

    - name: Remove non-quiesced temporary service-state artifacts from service host
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ service_state_snapshot_dir.path }}"
        - "{{ service_state_remote_archive }}"
      when: not (service_state_definition.backup_quiesce_user_services | default(false) | bool)

    - name: Create and stream quiesced service-state archive
      when:
        - service_state_definition.backup_quiesce_user_services | default(false) | bool
        - not (service_state_uses_device_backup | bool)
      block:
        - name: Create temporary quiesced service-state manifest directory
          ansible.builtin.tempfile:
            state: directory
            suffix: "{{ service_state_service }}-manifest"
          register: service_state_manifest_dir

        - name: Create private quiesced service-state staging directory
          ansible.builtin.file:
            path: "{{ service_state_definition.backup_staging_root }}"
            state: directory
            owner: "{{ service_state_definition.user_service_owner }}"
            group: "{{ service_state_definition.user_service_owner }}"
            mode: "0700"

        - name: Write quiesced service-state backup manifest
          ansible.builtin.copy:
            dest: "{{ service_state_manifest_dir.path }}/MANIFEST.json"
            mode: "0600"
            content: |
              {
                "schema_version": 1,
                "target": {{ service_state_service | to_json }},
                "archive_kind": "backup",
                "created_utc": {{ service_state_timestamp | to_json }},
                "description": {{ service_state_definition.description | default('') | to_json }},
                "paths": {{ service_state_existing_paths | to_json }}
              }

        - name: Quiesce active user services while creating service-state archive
          block:
            - name: Check configured user services are active before backup
              become: true
              become_user: "{{ service_state_definition.user_service_owner }}"
              ansible.builtin.command:
                argv:
                  - systemctl
                  - --user
                  - is-active
                  - "{{ item }}"
              environment:
                XDG_RUNTIME_DIR: "/run/user/{{ service_state_backup_user_service_uid.stdout | trim }}"
              loop: "{{ service_state_definition.user_services | default([]) }}"
              register: service_state_user_service_activity
              changed_when: false
              failed_when: service_state_user_service_activity.rc not in [0, 3]

            - name: Build active user service list for backup
              ansible.builtin.set_fact:
                service_state_active_user_services: >-
                  {{ service_state_user_service_activity.results
                     | selectattr('rc', 'equalto', 0)
                     | map(attribute='item')
                     | list }}

            - name: Stop active user services before backup archive
              become: true
              become_user: "{{ service_state_definition.user_service_owner }}"
              ansible.builtin.systemd_service:
                name: "{{ item }}"
                scope: user
                state: stopped
              environment:
                XDG_RUNTIME_DIR: "/run/user/{{ service_state_backup_user_service_uid.stdout | trim }}"
              loop: "{{ service_state_active_user_services }}"
              when: service_state_active_user_services | length > 0

            - name: Create quiesced service-state archive directly from managed paths
              ansible.builtin.command:
                argv: >-
                  {{ ['tar', '--numeric-owner', '-czf', service_state_remote_archive,
                      '-C', service_state_manifest_dir.path, 'MANIFEST.json', '-C', '/']
                     + service_state_existing_archive_paths }}
              changed_when: true
          always:
            - name: Restart active user services after backup archive
              become: true
              become_user: "{{ service_state_definition.user_service_owner }}"
              ansible.builtin.systemd_service:
                name: "{{ item }}"
                scope: user
                state: started
              environment:
                XDG_RUNTIME_DIR: "/run/user/{{ service_state_backup_user_service_uid.stdout | trim }}"
              loop: "{{ service_state_active_user_services }}"
              when: service_state_active_user_services | length > 0

        - name: Stream quiesced service-state archive into private values
          ansible.builtin.command:
            argv: >-
              {{ ['python', '/workspace/infra/ansible/scripts/fetch-service-state.py',
                  '--host', ansible_host, '--user', ansible_user,
                  '--ssh-common-args', ansible_ssh_common_args | default(''),
                  '--remote', service_state_remote_archive,
                  '--allowed-remote-root', service_state_remote_archive_root,
                  '--output', service_state_local_dir ~ '/' ~ service_state_archive_name]
                 + (['--become'] if ansible_become | default(false) | bool else []) }}
          changed_when: true
          delegate_to: localhost
          become: false

        - name: Restrict quiesced local service-state archive permissions
          ansible.builtin.file:
            path: "{{ service_state_local_dir }}/{{ service_state_archive_name }}"
            mode: "0600"
          delegate_to: localhost
          become: false
      always:
        - name: Remove temporary quiesced service-state manifest directory
          ansible.builtin.file:
            path: "{{ service_state_manifest_dir.path }}"
            state: absent
          when: service_state_manifest_dir is defined

        - name: Remove quiesced service-state archive from service host
          ansible.builtin.file:
            path: "{{ service_state_remote_archive }}"
            state: absent

        - name: Remove private quiesced service-state staging directory
          ansible.builtin.file:
            path: "{{ service_state_definition.backup_staging_root }}"
            state: absent

    - name: Create device-local Onclave service-state archive
      when: service_state_uses_device_backup | bool
      block:
        - name: Create temporary device-local service-state manifest directory
          ansible.builtin.tempfile:
            state: directory
            path: "{{ service_state_device_backup_root }}"
            prefix: ".{{ service_state_service }}-manifest-"
          register: service_state_device_manifest_dir

        - name: Write device-local service-state backup manifest
          ansible.builtin.copy:
            dest: "{{ service_state_device_manifest_dir.path }}/MANIFEST.json"
            mode: "0600"
            content: |
              {
                "schema_version": 1,
                "target": {{ service_state_service | to_json }},
                "archive_kind": "backup",
                "created_utc": {{ service_state_timestamp | to_json }},
                "description": {{ service_state_definition.description | default('') | to_json }},
                "paths": {{ service_state_existing_paths | to_json }}
              }

        - name: Quiesce active user service while creating device-local archive
          block:
            - name: Check configured user services are active before device-local backup
              become: true
              become_user: "{{ service_state_definition.user_service_owner }}"
              ansible.builtin.command:
                argv:
                  - systemctl
                  - --user
                  - is-active
                  - "{{ item }}"
              environment:
                XDG_RUNTIME_DIR: "/run/user/{{ service_state_backup_user_service_uid.stdout | trim }}"
              loop: "{{ service_state_definition.user_services | default([]) }}"
              register: service_state_user_service_activity
              changed_when: false
              failed_when: service_state_user_service_activity.rc not in [0, 3]

            - name: Build active user service list for device-local backup
              ansible.builtin.set_fact:
                service_state_active_user_services: >-
                  {{ service_state_user_service_activity.results
                     | selectattr('rc', 'equalto', 0)
                     | map(attribute='item')
                     | list }}

            - name: Stop active user service before device-local archive
              become: true
              become_user: "{{ service_state_definition.user_service_owner }}"
              ansible.builtin.systemd_service:
                name: "{{ item }}"
                scope: user
                state: stopped
              environment:
                XDG_RUNTIME_DIR: "/run/user/{{ service_state_backup_user_service_uid.stdout | trim }}"
              loop: "{{ service_state_active_user_services }}"
              when: service_state_active_user_services | length > 0

            - name: Create uncompressed temporary device-local service-state archive
              ansible.builtin.command:
                argv: >-
                  {{ ['tar', '--numeric-owner', '-cf', service_state_device_temporary_archive,
                      '-C', service_state_device_manifest_dir.path, 'MANIFEST.json', '-C', '/']
                     + service_state_existing_archive_paths }}
              changed_when: true

            - name: Restrict temporary device-local service-state archive permissions
              ansible.builtin.file:
                path: "{{ service_state_device_temporary_archive }}"
                mode: "0600"

            - name: Atomically replace latest device-local service-state archive
              ansible.builtin.command:
                argv:
                  - mv
                  - -f
                  - "{{ service_state_device_temporary_archive }}"
                  - "{{ service_state_device_latest_archive }}"
              changed_when: true
          always:
            - name: Restart active user service after device-local archive
              become: true
              become_user: "{{ service_state_definition.user_service_owner }}"
              ansible.builtin.systemd_service:
                name: "{{ item }}"
                scope: user
                state: started
              environment:
                XDG_RUNTIME_DIR: "/run/user/{{ service_state_backup_user_service_uid.stdout | trim }}"
              loop: "{{ service_state_active_user_services }}"
              when: service_state_active_user_services | length > 0

        - name: Calculate device-local latest archive checksum
          ansible.builtin.command:
            argv:
              - sha256sum
              - "{{ service_state_device_latest_archive }}"
          register: service_state_device_latest_checksum_result
          changed_when: false

        - name: Publish device-local latest archive checksum
          ansible.builtin.copy:
            dest: "{{ service_state_device_latest_checksum }}"
            owner: root
            group: root
            mode: "0600"
            content: "{{ service_state_device_latest_checksum_result.stdout.split()[0] }}  latest.tar\n"

        - name: Create unique pending input for device-local compression
          ansible.builtin.command:
            argv:
              - ln
              - "{{ service_state_device_latest_archive }}"
              - "{{ service_state_device_pending_archive }}"
          changed_when: true

        - name: Launch device-local service-state compression
          ansible.builtin.command:
            argv:
              - systemd-run
              - --quiet
              - --no-block
              - --collect
              - "--unit={{ service_state_device_compression_unit }}"
              - --service-type=exec
              - --property=UMask=0077
              - /usr/bin/python3
              - "{{ service_state_device_backup_root }}/compress-service-state-backup.py"
              - --backup-root
              - "{{ service_state_device_backup_root }}"
              - --pending
              - "{{ service_state_device_pending_archive }}"
              - --history-name
              - "{{ service_state_device_history_name }}"
              - --retention
              - "{{ service_state_definition.backup_retention_count | string }}"
          changed_when: true
      always:
        - name: Remove temporary device-local service-state manifest directory
          ansible.builtin.file:
            path: "{{ service_state_device_manifest_dir.path }}"
            state: absent
          when: service_state_device_manifest_dir is defined

        - name: Remove partial temporary device-local service-state archive
          ansible.builtin.file:
            path: "{{ service_state_device_temporary_archive }}"
            state: absent

    - name: Calculate local service-state archive checksum
      ansible.builtin.command:
        argv:
          - sha256sum
          - "{{ service_state_local_dir }}/{{ service_state_archive_name }}"
      register: service_state_checksum
      changed_when: false
      delegate_to: localhost
      become: false
      when: not (service_state_uses_device_backup | bool)

    - name: Write local service-state checksum manifest
      ansible.builtin.copy:
        dest: "{{ service_state_local_dir }}/{{ service_state_archive_name }}.sha256"
        mode: "0600"
        content: "{{ service_state_checksum.stdout }}\n"
      delegate_to: localhost
      become: false
      when: not (service_state_uses_device_backup | bool)

    - name: Report controller service-state backup path
      ansible.builtin.debug:
        msg: "{{ service_state_service }} state backup written to {{ service_state_local_dir }}/{{ service_state_archive_name }}"
      when: not (service_state_uses_device_backup | bool)

    - name: Report device-local service-state backup path
      ansible.builtin.debug:
        msg: >-
          {{ service_state_service }} state backup written to {{ service_state_device_latest_archive }};
          compression continues in {{ service_state_device_compression_unit }} as
          {{ service_state_device_history_name }}.
      when: service_state_uses_device_backup | bool
