web_fetch_trawl_image: ghcr.io/germondai/trawl:1.5.0@sha256:9cf6668dc5e7160d739991ca1edfe308c48638696571d9413a18399696586698 # noqa var-naming[no-role-prefix]
# Operator-approved one-time age exception for the already-tested Trawl digest.
web_fetch_age_exception_digests: # noqa var-naming[no-role-prefix]
  - sha256:9cf6668dc5e7160d739991ca1edfe308c48638696571d9413a18399696586698
