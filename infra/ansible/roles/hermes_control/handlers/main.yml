- name: Restart Hermes Control API
  ansible.builtin.systemd:
    name: hermes-mobile-control-api
    state: restarted
    daemon_reload: true

- name: Restart Hermes Control bridge
  ansible.builtin.systemd:
    name: hermes-control-bridge
    state: restarted
    daemon_reload: true

- name: Restart hermes gateway
  ansible.builtin.systemd:
    name: hermes-gateway
    state: restarted

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
