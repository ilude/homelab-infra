---
- name: Run verified direct access handoff for the onramp VM
  ansible.builtin.import_playbook: vm-direct-access-ready.yml
  vars:
    direct_vm_access_target_group: onramp_host
- name: Deploy unified Onclave on the Podman onramp host
  hosts: onramp_host
  gather_facts: true
  become: true
  vars:
    onclave_onramp_s3_hostname: >-
      {{ lookup('env', 'ONCLAVE_VAULT_S3_WORKSTATION_ENDPOINT')
         | regex_replace('^https://', '') }}
    onclave_onramp_s3_endpoint: "{{ onclave_onramp_s3_hostname }}:443"
    onclave_onramp_s3_secure: true
  pre_tasks:
    - name: Resolve host-rendered Onclave BWS secrets
      ansible.builtin.set_fact:
        onclave_rabbitmq_default_user: "{{ lookup('env', 'RABBITMQ_DEFAULT_USER') }}"
        onclave_rabbitmq_default_pass: "{{ lookup('env', 'RABBITMQ_DEFAULT_PASS') }}"
      no_log: true

  roles:
    - onclave_onramp
