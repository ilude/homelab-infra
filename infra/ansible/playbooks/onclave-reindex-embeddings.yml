---
- name: Run verified direct access handoff for the onramp VM
  ansible.builtin.import_playbook: vm-direct-access-ready.yml
  vars:
    direct_vm_access_target_group: onramp_host

- name: Rebuild Onclave YouTube embeddings from stored transcripts
  hosts: onramp_host
  gather_facts: false
  tasks:
    - name: Resolve Onclave deploy user UID
      become: true
      ansible.builtin.command:
        argv:
          - id
          - -u
          - "{{ onramp_host_deploy_user }}"
      register: onclave_reindex_deploy_uid
      changed_when: false

    - name: Resolve running Onclave core container ID
      become: true
      become_user: "{{ onramp_host_deploy_user }}"
      ansible.builtin.command:
        argv:
          - podman
          - ps
          - --quiet
          - --filter
          - label=io.podman.compose.project=onclave
          - --filter
          - label=com.docker.compose.service=onclave-core
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ onclave_reindex_deploy_uid.stdout | trim }}"
      register: onclave_reindex_core_ids
      changed_when: false

    - name: Require exactly one running Onclave core container
      ansible.builtin.assert:
        that:
          - onclave_reindex_core_ids.stdout_lines | length == 1
        quiet: true

    - name: Rebuild OpenRouter embeddings from stored YouTube transcripts
      become: true
      become_user: "{{ onramp_host_deploy_user }}"
      ansible.builtin.command:
        argv:
          - podman
          - exec
          - "{{ onclave_reindex_core_ids.stdout_lines[0] }}"
          - node_modules/.bin/tsx
          - src/reindex-embeddings.ts
          - --concurrency=4
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ onclave_reindex_deploy_uid.stdout | trim }}"
      register: onclave_reindex_result
      changed_when: true

    - name: Report Onclave embedding rebuild result
      ansible.builtin.debug:
        var: onclave_reindex_result.stdout_lines
