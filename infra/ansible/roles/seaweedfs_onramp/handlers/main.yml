---
- name: Restart seaweedfs state
  become: true
  become_user: "{{ onramp_host_deploy_user }}"
  ansible.builtin.systemd_service:
    name: seaweedfs-state.service
    scope: user
    state: restarted
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ seaweedfs_onramp_deploy_user_uid.stdout | trim }}"

- name: Restart caddy
  ansible.builtin.systemd_service:
    name: caddy
    state: restarted
    daemon_reload: true
