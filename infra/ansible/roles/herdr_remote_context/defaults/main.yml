---
herdr_remote_context_pi_home: '/home/{{ herdr_operator_user }}'
herdr_remote_context_pnpm_home: '{{ herdr_remote_context_pi_home }}/.local/share/pnpm'
herdr_remote_context_identity_file: '{{ herdr_remote_context_pi_home }}/.ssh/id_ed25519_herdr_onramp'
herdr_remote_context_name: herdr-onramp
herdr_remote_context_ssh_alias: herdr-onramp
herdr_remote_context_command: docker system dial-stdio
herdr_remote_context_known_hosts_file: '{{ herdr_remote_context_pi_home }}/.ssh/known_hosts.herdr-onramp'
herdr_remote_context_ssh_config_file: '{{ herdr_remote_context_pi_home }}/.ssh/config'
herdr_remote_context_host: '{{ hostvars[groups["onramp_host"][0]].ansible_host }}'
herdr_remote_context_user: '{{ hostvars[groups["onramp_host"][0]].onramp_host_deploy_user }}'
