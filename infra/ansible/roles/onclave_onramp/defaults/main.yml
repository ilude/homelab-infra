---
onclave_onramp_base_dir: "{{ onramp_host_deploy_dir }}/onclave"
onclave_onramp_data_root: "{{ onramp_host_deploy_dir }}/menos/data"
onclave_onramp_compose_provider_command: "{{ onramp_host_compose_provider_command | default('podman-compose') }}"
onclave_onramp_core_port: 18080
onclave_onramp_amqp_port: 5672
onclave_onramp_required_packages: []
onclave_onramp_queue_ttl_ms: 604800000
onclave_onramp_queue_max_length: 1000
onclave_onramp_heartbeat_stale_ms: 90000
onclave_onramp_max_exchanges: 16
onclave_onramp_max_total_tokens: 200000
onclave_onramp_s3_bucket: menos
onclave_onramp_s3_region: us-east-1
# SeaweedFS is managed separately. This is the server-side Compose/Podman
# endpoint; the workstation endpoint is resolved lazily from BWS by Pi.
onclave_onramp_s3_hostname: host.containers.internal
onclave_onramp_s3_endpoint: host.containers.internal:8333
onclave_onramp_s3_secure: false
onclave_onramp_openai_api_key: ""
onclave_onramp_embedding_provider: openrouter
onclave_onramp_embedding_model: intfloat/e5-large-v2
onclave_onramp_unified_pipeline_model: ""
onclave_onramp_callback_url: ""
onclave_onramp_callback_secret: ""
# Applying the service is non-destructive by default.  The one-time cutover
# workflow must opt in explicitly after its backup and parity gates pass.
onclave_onramp_enable_cutover: false
