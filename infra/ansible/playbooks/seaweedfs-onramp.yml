---
- name: Run verified direct access handoff for the onramp VM
  ansible.builtin.import_playbook: vm-direct-access-ready.yml
  vars:
    direct_vm_access_target_group: onramp_host

- name: Deploy the SeaweedFS OpenTofu state backend
  hosts: onramp_host
  gather_facts: true
  become: true
  vars:
    # The route name is derived from the BWS-backed endpoint, never a tracked
    # live hostname supplied independently by an inventory file.
    seaweedfs_onramp_server_name: "{{ seaweedfs_s3_endpoint | regex_replace('^https?://', '') }}"
  pre_tasks:
    - name: Resolve controller-only SeaweedFS BWS credentials
      ansible.builtin.set_fact:
        seaweedfs_s3_access_key: "{{ lookup('env', 'SEAWEEDFS_S3_ACCESS_KEY') }}"
        seaweedfs_s3_secret_key: "{{ lookup('env', 'SEAWEEDFS_S3_SECRET_KEY') }}"
        seaweedfs_onramp_onclave_access_key: "{{ lookup('env', 'ONCLAVE_VAULT_S3_ACCESS_KEY') }}"
        seaweedfs_onramp_onclave_secret_key: "{{ lookup('env', 'ONCLAVE_VAULT_S3_SECRET_KEY') }}"
      no_log: true

    - name: Validate SeaweedFS Caddy hostname from BWS workstation HTTPS endpoint
      ansible.builtin.assert:
        that:
          - lookup('env', 'ONCLAVE_VAULT_S3_WORKSTATION_ENDPOINT') is match('^https://[A-Za-z0-9.-]+$')
          - seaweedfs_s3_endpoint == lookup('env', 'ONCLAVE_VAULT_S3_WORKSTATION_ENDPOINT')
          - seaweedfs_onramp_server_name == (lookup('env', 'ONCLAVE_VAULT_S3_WORKSTATION_ENDPOINT') | regex_replace('^https://', ''))
        fail_msg: >-
          SeaweedFS Caddy must use the hostname from the BWS workstation HTTPS
          endpoint; do not supply a separate tracked live hostname.
      no_log: true

    - name: Read BWS DNS record catalog for SeaweedFS hostname validation
      ansible.builtin.set_fact:
        seaweedfs_bws_dns_records: "{{ lookup('file', lookup('env', 'DNS_RECORDS_FILE')) | from_json }}"
      delegate_to: localhost
      become: false

    - name: Validate existing BWS DNS workflow contains SeaweedFS Caddy hostname
      ansible.builtin.assert:
        that:
          - seaweedfs_bws_dns_records.a_records[seaweedfs_onramp_server_name] is defined
        fail_msg: >-
          Add the SeaweedFS hostname to the existing BWS DNS record catalog and
          run the established Technitium DNS workflow before enabling the route.
      no_log: true

  roles:
    - seaweedfs_onramp

  post_tasks:
    - name: Ensure the independent Onclave menos bucket exists
      become: false
      delegate_to: localhost
      ansible.builtin.command:
        argv:
          - python
          - -c
          - >-
            import boto3;
            from botocore.client import Config;
            c=boto3.client('s3', endpoint_url='{{ seaweedfs_s3_endpoint }}',
            region_name='{{ seaweedfs_s3_region }}',
            aws_access_key_id='{{ seaweedfs_s3_access_key }}',
            aws_secret_access_key='{{ seaweedfs_s3_secret_key }}',
            config=Config(signature_version='s3v4', s3={'addressing_style':'path'}));
            b='{{ seaweedfs_onramp_onclave_bucket }}';
            created=b not in [x['Name'] for x in c.list_buckets().get('Buckets', [])];
            c.create_bucket(Bucket=b) if created else c.head_bucket(Bucket=b);
            print({'created': created})
      args:
        chdir: /workspace
      changed_when: "'True' in seaweedfs_onramp_bucket_init.stdout"
      register: seaweedfs_onramp_bucket_init
      no_log: true

    - name: Configure and verify the versioned state bucket
      become: false
      delegate_to: localhost
      ansible.builtin.command:
        argv:
          - python
          - scripts/seaweedfs-state.py
          - ensure
          - --endpoint
          - "{{ seaweedfs_s3_endpoint }}"
          - --bucket
          - "{{ seaweedfs_s3_bucket }}"
          - --state-key
          - "{{ seaweedfs_s3_key }}"
          - --region
          - "{{ seaweedfs_s3_region }}"
          - --state-noncurrent-days
          - "{{ seaweedfs_state_noncurrent_days | string }}"
          - --lock-noncurrent-days
          - "{{ seaweedfs_lock_noncurrent_days | string }}"
      args:
        chdir: /workspace
      environment:
        AWS_ACCESS_KEY_ID: "{{ seaweedfs_s3_access_key }}"
        AWS_SECRET_ACCESS_KEY: "{{ seaweedfs_s3_secret_key }}"
      no_log: true
