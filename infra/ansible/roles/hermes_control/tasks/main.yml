- name: Validate Hermes Control required variables
  ansible.builtin.assert:
    that:
      - hermes_runtime_user is match('^[a-z_][a-z0-9_-]{0,31}$')
      - hermes_control_source_url | length > 0
      - hermes_control_source_ref is match('^[0-9a-f]{40}$')
      - hermes_control_domain | length > 0
      - hermes_control_api_token | length > 0
      - hermes_control_bridge_token | length > 0
      - hermes_control_require_task_approval | bool
      - hermes_control_api_host == '127.0.0.1'
    fail_msg: >-
      Hermes Control requires an immutable source commit, private hostname,
      independent API and bridge tokens, loopback-only API binding, and mandatory approval.

- name: Check for legacy Hermes Control API unit
  ansible.builtin.stat:
    path: /etc/systemd/system/hermes-control-api.service
  register: hermes_control_legacy_api_unit

- name: Stop legacy Hermes Control API service
  ansible.builtin.systemd:
    name: hermes-control-api
    state: stopped
    enabled: false
  when: hermes_control_legacy_api_unit.stat.exists
  failed_when: false

- name: Check out Hermes Control at the reviewed revision
  ansible.builtin.git:
    repo: "{{ hermes_control_source_url }}"
    dest: "{{ hermes_control_source_checkout_path }}"
    version: "{{ hermes_control_source_ref }}"
    single_branch: true
    update: true
  register: hermes_control_source
  become: true
  no_log: true

- name: Verify Hermes Control source revision
  ansible.builtin.command:
    argv: [git, -C, "{{ hermes_control_source_checkout_path }}", rev-parse, HEAD]
  register: hermes_control_checked_out_ref
  changed_when: false
  failed_when: hermes_control_checked_out_ref.stdout | trim != hermes_control_source_ref

- name: Create Hermes Control installer virtual environment
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - venv
      - "{{ hermes_control_source_checkout_path }}/.venv"
  args:
    creates: "{{ hermes_control_source_checkout_path }}/.venv/bin/python"

- name: Install Hermes Control installer CLI in source checkout
  ansible.builtin.command:
    argv:
      - "{{ hermes_control_source_checkout_path }}/.venv/bin/python"
      - -m
      - pip
      - install
      - --disable-pip-version-check
      - -r
      - "{{ hermes_control_source_checkout_path }}/requirements.txt"
      - "{{ hermes_control_source_checkout_path }}"
  args:
    chdir: "{{ hermes_control_source_checkout_path }}"
  changed_when: true

- name: Ensure Hermes Control installer configuration directory exists
  ansible.builtin.file:
    path: "{{ hermes_control_config_dir }}"
    state: directory
    owner: root
    group: "{{ hermes_runtime_user }}"
    mode: '0750'

- name: Pre-seed Hermes Control installer environment
  ansible.builtin.template:
    src: control-api.env.j2
    dest: "{{ hermes_control_config_dir }}/control-api.env"
    owner: root
    group: "{{ hermes_runtime_user }}"
    mode: '0640'
  no_log: true
  notify:
    - Restart Hermes Control API
    - Restart Hermes Control bridge

- name: Run Hermes Control installer preflight
  ansible.builtin.command:
    argv:
      - "{{ hermes_control_source_checkout_path }}/.venv/bin/hermes-control"
      - --root
      - "{{ hermes_control_source_checkout_path }}"
      - --hermes-user
      - "{{ hermes_runtime_user }}"
      - preflight
  environment:
    HERMES_CONTROL_INSTALL_DIR: "{{ hermes_control_install_dir }}"
    HERMES_CONTROL_CONFIG_DIR: "{{ hermes_control_config_dir }}"
    HERMES_CONTROL_STATE_DIR: "{{ hermes_control_state_dir }}"
  args:
    chdir: "{{ hermes_control_source_checkout_path }}"
  changed_when: false

- name: Run Hermes Control installer
  ansible.builtin.command:
    argv:
      - "{{ hermes_control_source_checkout_path }}/.venv/bin/hermes-control"
      - --root
      - "{{ hermes_control_source_checkout_path }}"
      - --hermes-user
      - "{{ hermes_runtime_user }}"
      - install
  environment:
    HERMES_CONTROL_INSTALL_DIR: "{{ hermes_control_install_dir }}"
    HERMES_CONTROL_CONFIG_DIR: "{{ hermes_control_config_dir }}"
    HERMES_CONTROL_STATE_DIR: "{{ hermes_control_state_dir }}"
  args:
    chdir: "{{ hermes_control_source_checkout_path }}"
  register: hermes_control_install
  changed_when: true
  no_log: true
  notify:
    - Restart Hermes Control API
    - Restart Hermes Control bridge
    - Restart hermes gateway

- name: Enforce Hermes Control infrastructure environment policy
  ansible.builtin.template:
    src: control-api.env.j2
    dest: "{{ hermes_control_config_dir }}/control-api.env"
    owner: root
    group: "{{ hermes_runtime_user }}"
    mode: '0640'
  no_log: true
  notify:
    - Restart Hermes Control API
    - Restart Hermes Control bridge

- name: Install Hermes gateway Control plugin environment
  ansible.builtin.template:
    src: plugin.env.j2
    dest: "{{ hermes_control_config_dir }}/plugin.env"
    owner: root
    group: "{{ hermes_runtime_user }}"
    mode: '0640'
  no_log: true
  notify: Restart hermes gateway

- name: Remove legacy Hermes Control API unit
  ansible.builtin.file:
    path: /etc/systemd/system/hermes-control-api.service
    state: absent
  when: hermes_control_legacy_api_unit.stat.exists
  notify: Reload systemd

- name: Flush Hermes Control service changes before readiness checks
  ansible.builtin.meta: flush_handlers

- name: Verify Hermes Control services are active
  ansible.builtin.command:
    argv: [systemctl, is-active, "{{ item }}"]
  loop: [hermes-control-bridge, hermes-mobile-control-api]
  register: hermes_control_service_active
  changed_when: false
  retries: 6
  delay: 2
  until: hermes_control_service_active.rc == 0

- name: Verify Hermes Control bridge socket accepts connections
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - >-
        import socket; socket_path = "{{ hermes_control_plugin_socket }}";
        client = socket.socket(socket.AF_UNIX); client.settimeout(2);
        client.connect(socket_path); client.close()
  changed_when: false
  register: hermes_control_bridge_socket
  retries: 6
  delay: 2
  until: hermes_control_bridge_socket.rc == 0

- name: Verify Hermes Control API health
  ansible.builtin.uri:
    url: "http://{{ hermes_control_api_host }}:{{ hermes_control_api_port }}/health"
    status_code: 200
    return_content: false
  register: hermes_control_health
  retries: 6
  delay: 2
  until: hermes_control_health.status == 200

- name: Verify authenticated Hermes Control diagnostics
  ansible.builtin.uri:
    url: "http://{{ hermes_control_api_host }}:{{ hermes_control_api_port }}/diagnostics"
    headers:
      Authorization: "Bearer {{ hermes_control_api_token }}"
    status_code: 200
    return_content: false
  no_log: true
  register: hermes_control_diagnostics
  retries: 6
  delay: 2
  until: hermes_control_diagnostics.status == 200
